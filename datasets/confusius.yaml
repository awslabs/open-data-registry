Name: ConfUSIus Functional Ultrasound Imaging Dataset Collection
Description: |
  ConfUSIus Functional Ultrasound Imaging Dataset Collection is a curated set of public
  functional ultrasound imaging (fUSI) datasets and derived templates for neuroscience.
  The collection brings together data from multiple studies and laboratories and makes it
  available for programmatic access through stable cloud paths and the ConfUSIus Python
  toolkit. Where possible, datasets are organized or re-exported using fUSI-BIDS/BIDS
  conventions; original formats, derivatives, provenance, and licenses vary by source
  dataset.
Documentation: https://confusius.tools/latest/user-guide/datasets/
Contact: maintainers@confusius.tools
ManagedBy: "[ConfUSIus](https://confusius.tools/)"
UpdateFrequency: Updated as new openly redistributable functional ultrasound imaging datasets or corrected metadata are incorporated into the ConfUSIus dataset collection.
Tags:
  - aws-pds
  - biology

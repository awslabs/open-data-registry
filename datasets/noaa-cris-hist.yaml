Name: NOAA Climate Resilience Information System CONUS Thresholds 
Description: |
  The Climate Resilience Information System (CRIS) provides a variety of historical observations and future projections of a variety of decision-relevant thresholds of temperature and precipitation. 
  <br><br>
  LOCA2 and STAR-ESDM are two downscaled climate projection datasets covering the Contiguous United States (CONUS) chosen for inclusion in the 5th U.S. National Climate Assessment. These datasets include 16 models along with a weighted ensemble for the scenarios SSP2-4.5, SSP3-7.0 and SSP5-8.5. The precipitation and temperature variables were processed into thresholds by the NOAA Technical Support Unit. 
  <br><br>
  Livneh and nClimGrid are gridded observed historical climatology data that were used in the LOCA2 and STAR-ESDM downscaling process. The original Livneh and nClimGrid daily temperature and precipitation observations have been converted to the same series of thresholds as LOCA2 and STAR. 
  <br><br>
  Details on thresholds, models, scenarios, time, and processing methodologies can be found at https://cris.climate.gov/pages/about-the-data
  <br><br>
Documentation: |
  For information, please consult https://cris.climate.gov/pages/about-the-data.

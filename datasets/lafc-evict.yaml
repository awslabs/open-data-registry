Name: "LAFC-Evict: Learning-Augmented Cache Eviction Dataset"

Description: >-
  LAFC-Evict is a derived, tabular research dataset of counterfactual
  supervision labels for learning-augmented cache-eviction research. Each row
  describes one candidate object considered for eviction at one full-cache-miss
  decision point, together with engineered state/candidate features and a
  label describing what would happen to the cache miss rate over a short
  future horizon if that specific candidate were evicted. It is intended for
  training and evaluating machine-learning-based cache-eviction policies and
  for studying disagreement between learned predictors and classical
  eviction heuristics such as LRU. LAFC-Evict is a generated/derived
  artifact: it is computed by the dataset author from third-party, CC0-1.0
  Wikimedia pageview data, and it does not redistribute any raw Wikimedia
  pageview rows, raw page titles, or third-party trace data. Upstream
  Wikimedia data must be cited separately according to its own terms; this
  release claims authorship only of the derived candidate-row features and
  labels, not of the underlying popularity signal.

  The current public release (v0.3) contains 22,356,992 rows across two
  Parquet configurations, built entirely from the `wiki2018` trace family.
  A smaller, fully synthetic companion dataset,
  `SoroushVahidi/lafc-evict-sample`, exists separately as a packaging/format
  smoke-test fixture and is not a scientific release.


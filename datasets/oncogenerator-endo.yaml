Name: OncoGenerator-Endo
Description: >-
  OncoGenerator-Endo is a synthetic endometrial cancer benchmark dataset. Each cohort contains
  clinical variables (age, grade, stage, tumour type, BMI and others) and log2 fold-change values for
  180 proteins, generated with a known and recorded ground truth (true per-protein effects for four
  clinical contrasts, noise-free expected values and batch effects). Core cohorts of 1,000, 10,000 and
  100,000 patients are provided, plus scenarios with low or high noise, imbalanced late-stage
  prevalence, five batches, and 10% MCAR or 20% MNAR missing values. The data are synthetic and are
  intended for benchmarking differential expression, feature selection, classification, imputation and
  batch-correction methods. They must not be used for biological or clinical conclusions.
Documentation: https://github.com/NehaAr/OncoGenerator

Resources:
  - Description: |
      Regional UBEM **input bundles** under `globi-inputs/<ISO>/<Partner>/vNNN/`:
      SQLite component/HVAC libraries (`components-lib.db`), semantic archetype
      mappings, TMY and 2050 SSP2-4.5 FTMY weather files (`.epw`, `.ddy`, `.zip`),
      and `input-version.yml` sha256 manifests (8 regions, 130 files, ~57 MB at
      launch; excludes raw `buildings.geojson`).
    ARN: arn:aws:s3:::globi-regional-building-data
    Region: us-east-1
    Type: S3 Bucket
    RequesterPays: false
    Explore:
      - "[Technical documentation & access guide](https://github.com/MITSustainableDesignLab/globi-data/blob/main/docs/PUBLIC-DATA.md)"
      - "[Input bundle catalog in globi-data](https://github.com/MITSustainableDesignLab/globi-data/tree/main/inputs)"
      - "[Data components & schema specification](https://github.com/MITSustainableDesignLab/globi-data/blob/main/docs/DATA-COMPONENTS.md)"
  - Description: |
      Building-level **processed simulation results** in Apache Parquet under
      `globi-public/<ISO>/<City>/<weather>/<Scenario>/<output_version>/`:
      `energy_and_peak.parquet`, `overheating.parquet`, and
      `emissions_by_building.parquet` (84 Parquet objects across 28 TMY/FTMY
      experiments at launch).
    ARN: arn:aws:s3:::globi-regional-building-data
    Region: us-east-1
    Type: S3 Bucket
    RequesterPays: false
    Explore:
      - "[Public result products & Parquet keys](https://github.com/MITSustainableDesignLab/globi-data/blob/main/docs/PUBLIC-PRODUCT.md)"
      - "[Experiment provenance manifests](https://github.com/MITSustainableDesignLab/globi-data/tree/main/outputs/runs)"

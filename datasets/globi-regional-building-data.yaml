Name: GloBI Regional Building Inventory Data
Description: |
  Versioned Urban Building Energy Modeling (UBEM) input bundles and building-level
  simulation results from the Global Building Inventory (GloBI) by the MIT
  Sustainable Design Lab, spanning eight regions across seven countries (Brazil,
  India, Kenya, Norway, Portugal, Singapore, United Kingdom, and United States).

  Two prefixes share one public S3 bucket:
  (1) `globi-inputs/` stores immutable regional input bundles (SQLite EnergyPlus
  component/material libraries, semantic archetype mappings, and historical TMY
  plus 2050 SSP2-4.5 FTMY weather files; excludes raw partner building footprints,
  whose sha256 hashes are recorded for verification).
  (2) `globi-public/` stores analysis-ready Apache Parquet tables across 28
  paired climate and decarbonization/resilience experiments (`energy_and_peak`,
  `overheating`, and `emissions_by_building`). Cryptographic provenance and
  version catalogs are maintained in the globi-data GitHub repository.

  Draft: bucket ARN and region are placeholders pending AWS Open Data onboarding.
Documentation: https://github.com/MITSustainableDesignLab/globi-data/blob/main/docs/PUBLIC-DATA.md
Contact: sd-lab-admin@mit.edu
ManagedBy: "[MIT Sustainable Design Lab](https://sustainability.mit.edu/)"
UpdateFrequency: |
  Immutable versioned releases (`v001`, `v002`, ...): new prefixes are added when
  partner input bundles are updated, new cities are onboarded, or additional
  climate/policy scenarios are simulated. Prior versions remain available for
  reproducibility; see inputs/*/CURRENT.yml and outputs/STATUS.md in globi-data.
Citation: |
  Please cite the Global Building Inventory (GloBI) project by the MIT Sustainable
  Design Lab and reference GloBI Regional Building Inventory Data on the Registry
  of Open Data on AWS (https://registry.opendata.aws/globi-regional-building-data).
  A peer-reviewed publication DOI will be added upon publication.
License: |
  MIT License (https://github.com/MITSustainableDesignLab/globi-data/blob/main/LICENSE).
  Partner-derived stock attributes carry source attribution noted in per-version
  README files; raw building footprint geometries are not distributed in this bucket.

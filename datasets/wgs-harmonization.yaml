Name: "The Whole Genome Sequence Harmonization Study (WGS_Harmonization)"

Description: |
  The Whole Genome Sequence Harmonization Study provides uniformly processed
  whole-genome sequencing data generated from the three primary AMP-AD cohort
  studies: the Religious Orders Study and Memory and Aging Project (ROSMAP),
  the Mount Sinai Brain Bank (MSBB), and the Mayo RNAseq Study. The project
  harmonizes whole-genome sequence data across these cohorts to support
  cross-study analyses of genomic variation associated with aging,
  Alzheimer's disease, and related dementias.

Documentation: "https://doi.org/10.7303/9618322"


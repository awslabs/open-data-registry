License: >
  FathomNet visual content is licensed on a per-asset basis using permissive
  licenses selected by the data contributor. The license for each image is
  recorded in its metadata. Accepted licenses are documented at
  https://database.fathomnet.org/fathomnet/#/license.
Citation: >
  Katija, K., Orenstein, E., Schlining, B., Lundsten, L., Barnard, K., Sainz,
  G., Boulais, O., Cromwell, M., Butler, E., Woodward, B., and Bell, K. L. C.
  (2022). FathomNet: A global image database for enabling artificial
  intelligence in the ocean. Scientific Reports, 12, 15914.
  https://doi.org/10.1038/s41598-022-19939-2
Resources:
  # TODO: bucket name, account ID, and prefixes are placeholders until the
  # sponsored account and CloudFormation stack exist.
  - Description: >
      FathomNet images (JPEG, PNG, TIFF) and video (MP4, MOV) under data/,
      with thumbnails under data/thumbnails/. Image metadata and annotations
      (bounding boxes, classifications, segmentation masks) are provided as
      partitioned Parquet under metadata/ for querying with Amazon Athena,
      with COCO JSON and CSV exports under exports/.
    ARN: arn:aws:s3:::fathomnet-pds
    Region: us-west-2
    Type: S3 Bucket
    Explore:
      - '[Browse Bucket](https://fathomnet-pds.s3.us-west-2.amazonaws.com/index.html)'
  - Description: Notifications for new FathomNet objects
    ARN: arn:aws:sns:us-west-2:000000000000:fathomnet-pds-object_created
    Region: us-west-2
    Type: SNS Topic

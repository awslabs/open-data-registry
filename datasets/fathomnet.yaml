Name: FathomNet
Description: >
  FathomNet is a global, open-source database of ocean imagery and AI-ready
  annotations. It aggregates more than three decades of imagery from remotely
  operated vehicles, autonomous underwater vehicles, drop cameras, divers, and
  citizen scientists using the FathomVerse apps. Images carry standardized
  metadata (time, location, depth, environmental measurements, provenance, and
  taxonomic concepts) and expert, community, and machine-generated annotations,
  including classifications, bounding boxes, and segmentation masks. With more
  than 480,000 images and 1.2 million bounding boxes, FathomNet reflects the
  real conditions of ocean science (variable illumination, occlusion, complex
  backgrounds, unusual viewpoints, and long-tailed taxonomic distributions) and
  is used to train, test, and benchmark computer vision models for detection,
  classification, segmentation, and biodiversity monitoring.
Documentation: https://github.com/fathomnet/fathomnet-open-data
Contact: fathomnet@mbari.org
ManagedBy: "[Monterey Bay Aquarium Research Institute](https://www.mbari.org/)"
UpdateFrequency: Ad hoc, as new imagery and annotations are contributed and reviewed.

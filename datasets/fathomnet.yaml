Name: FathomNet
Description: >
  FathomNet is a global, open-source database of underwater imagery and
  machine-learning-ready annotations designed to make ocean visual data usable
  at scale. It aggregates imagery collected over more than three decades by
  research institutions using remotely operated vehicles, autonomous
  underwater vehicles, drop cameras, and diver-based imaging systems, along
  with citizen science contributions through the FathomVerse and FathomVerse
  ID apps. Images are paired with standardized metadata (time, location,
  depth, environmental measurements, provenance, and taxonomic concepts
  integrated with the World Register of Marine Species) and enriched with
  expert, community, and machine-generated annotations including
  classifications, bounding boxes, and segmentation masks. FathomNet contains
  more than 480,000 images and 1.2 million bounding box annotations. Unlike
  curated, iconic image collections, FathomNet captures the real conditions of
  operational ocean science: variable illumination, occlusion, complex
  backgrounds, unusual viewpoints, and strongly long-tailed taxonomic
  distributions. The data are used to train, test, and benchmark computer
  vision systems for detection, classification, segmentation, and
  biodiversity monitoring.

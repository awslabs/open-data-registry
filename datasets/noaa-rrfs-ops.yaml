Name: "NOAA Rapid Refresh Forecast System (RRFS) and RRFS Ensemble Forecast System (REFS) [Operational]"
Description: |
  #### Update

  Version 1 of the RRFS and REFS are scheduled to be implemented on October 6th, 2026 per the following [Service Change Notice](https://www.weather.gov/media/notification/pdf_2026/scn26-048_RRFS_and_REFS_Implementation.aab.pdf). Please note that upon the start of the pre-implementation parallel phase, August 12th, 2026, the RRFS/REFS [prototype data feed](https://noaa-rrfs-pds.s3.amazonaws.com/index.html) will no longer be updated.
  <br/><br/>
  Users will be able to access the operational data through this bucket or through the feeds noted in the Service Change Notice to receive the RRFS and REFS outputs. Note that the files, filenames, and directory structures in this bucket will align with those described in the Service Change Notice.
  <br/><br/>
  Please check back here and monitor [NWS's Service Change Notices](https://www.weather.gov/notification/) for the latest updates as the implementation date nears.

  ---
  The Rapid Refresh Forecast System (RRFS) is the National Oceanic and Atmospheric Administration’s (NOAA) next generation high-resolution, rapidly-updated deterministic (RRFS) and ensemble prediction system (RRFS Ensemble Forecast System; REFS). The RRFSfeatures a 3 km grid covering North America and includes deterministic forecasts every hour out to 18 hours, with deterministic forecasts to 84 hours and ensemble forecasts to 60 hours four times per day at 00, 06, 12, and 18 UTC. The RRFS and REFS provide guidance to support forecast interests including, but not limited to, aviation, severe convective weather, energy, heavy precipitation, and winter weather on timescales where rapidly-updated guidance is particularly useful.
  <br/><br/>
  The RRFS is underpinned by the [Unified Forecast System (UFS)](https://ufs.epic.noaa.gov/), a community-based Earth modeling initiative, and benefits from collaborative development efforts across NOAA, academia, and research institutions.
 
Documentation: https://www.nco.ncep.noaa.gov/pmb/products/rrfs/

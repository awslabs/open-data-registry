Name: NASA Planetary Data System Geosciences Node Planetary Science Archive
Description: |
  The NASA Planetary Data System (PDS) Geosciences Node at Washington University in
  St. Louis archives and distributes data for the geosciences discipline—the study of
  the surfaces and interiors of terrestrial planetary bodies, including Mars, the Moon,
  Venus, Mercury, and related targets (see node holdings). Data on AWS will be provided
  in standard PDS3 and PDS4 archive formats: each product includes science data,
  documentation, and ancillary files with a PDS label (keyword=value in PDS3; XML in
  PDS4). PDS4 archives use directory names beginning with urn-nasa-pds.
Documentation: https://github.com/fossettlab/open-data-registry/blob/main/pds-geosciences-opendata/README.md
Contact: Alex Bradley, abradley@wustl.edu
ManagedBy: "[NASA PDS Geosciences Node, Washington University in St. Louis](https://pds-geosciences.wustl.edu/)"
UpdateFrequency: |
  The Geosciences Node archives new mission deliveries on an ongoing basis. The node
  DOI list is updated as new DOIs are acquired (see node documentation).
Size: about 400 TB
Tags:
  - nasa
  - planetary
  - mars
  - geospatial
License: "[Public domain](https://pds-geosciences.wustl.edu/faq.html). There are no restrictions on the use of PDS data; please cite datasets as described in the [PDS citation guidance](https://pds.nasa.gov/datastandards/citing/)."

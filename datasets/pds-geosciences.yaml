Name: Independent Copy of NASA Planetary Data System Geosciences Node Data
Description: |
  A proposed independent copy of public data sourced from the NASA Planetary Data
  System (PDS) Geosciences Node, operated by WashU EEPS (Washington University in
  St. Louis Department of Earth, Environmental, and Planetary Sciences). NASA and
  the PDS Geosciences Node do not operate this copy; source attribution does not
  imply their endorsement.
  The source archive covers the surfaces and interiors of terrestrial planetary
  bodies, including Mars, the Moon, Venus, and Mercury, and includes PDS3 and PDS4
  science data, documentation, and ancillary files. Product metadata are stored in
  PDS labels (keyword=value in PDS3; XML in PDS4).
  The AWS bucket has not yet been provisioned. The copy's coverage is to be
  determined; this draft does not claim a complete or current mirror of the source
  archive. The documentation link below describes the source archive.
Documentation: https://pds-geosciences.wustl.edu/
Contact: Alex Bradley, abradley@wustl.edu
ManagedBy: "WashU EEPS (Washington University in St. Louis Department of Earth, Environmental, and Planetary Sciences)"
UpdateFrequency: |
  To be determined for this independent copy. The source archive's release schedule
  does not establish the copy's refresh schedule.
Tags:
  - nasa
  - planetary
  - mars
  - geospatial
License: "[Public domain](https://pds-geosciences.wustl.edu/faq.html). There are no restrictions on the use of PDS data; please cite datasets as described in the [PDS citation guidance](https://pds.nasa.gov/datastandards/citing/)."

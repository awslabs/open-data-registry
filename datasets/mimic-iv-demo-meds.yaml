Name: MIMIC-IV demo data in the Medical Event Data Standard (MEDS)
Description: This dataset is an automated ETL conversion of the MIMIC-IV Clinical
  Database Demo into the Medical Event Data Standard (MEDS). MEDS is a data schema
  for storing streams of medical events such as those sourced from Electronic Health
  Records or claims records. MEDS is intentionally a minimal standard, designed for
  maximum interoperability across datasets, existing tools, and model architectures.
  By providing a simple standardization layer between datasets and model-specific
  code, MEDS is intended to help make machine learning research for EHR data more
  reproducible, robust, computationally performant, and collaborative.

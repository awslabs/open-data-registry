Name: The BigBrain
Description: 'The BigBrain is an ultra-high-resolution 3D reconstruction of a complete human brain, created from 7,404 coronal histological sections cut at 20 µm, stained for cell bodies, digitized at high resolution, and reconstructed in 3D at 20 µm isotropic resolution. The dataset includes volumetric reconstructions, cortical surfaces, classified tissue volumes, cortical layer maps, cytoarchitectonic maps, selected 1 µm scans, and additional derived datasets. It is used as a reference for studying human brain microstructure, validating neuroimaging measurements, developing brain parcellations, training machine-learning methods, and supporting computational neuroscience.

  '
Contact: bryan.caron@mcgill.ca
Documentation: https://bigbrainproject.org/maps-and-models.html
ManagedBy: '[McGill Centre for Integrative Neuroscience, McGill University](https://www.mcgill.ca/neuro/about/neuroinformatics/mcin)'
UpdateFrequency: 'The core BigBrain dataset is maintained as a reference dataset. New versions and additional high-resolution histology-derived brain models, maps, and representations are added as they become available. Anticipated growth is approximately 1 TB per year.

  '

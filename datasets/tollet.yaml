Name: 'tOLIet: Single-lead Thigh-based Electrocardiography Using Polimeric Dry Electrodes'
Description: Our team previously introduced an innovative concept for an "invisible"
  Electrocardiography (ECG) system, incorporating electrodes and sensors into a toilet
  seat design to enable signal acquisition from the thighs. Building upon that work,
  we now present a novel dataset featuring real-world, single-lead ECG signals captured
  at the thighs, offering a valuable resource for advancing research on thigh-based
  ECG for cardiovascular disease assessment. To our knowledge, this is the first dataset
  of its kind. The tOLIet dataset comprises 149 ECG recordings collected from 86 individuals
  (50 females, 36 males) with an average age of 31.73 ± 13.11 years, a mean weight
  of 66.89 ± 10.70 kg, and an average height of 166.82 ± 6.07 cm. Participants were
  recruited through direct contact with the Principal Investigator at Centro Hospitalar
  Universitário de Lisboa Central (CHULC) and via clinical consultations conducted
  at the same institution. Each recording includes four differential signals acquired
  from electrode pairs embedded in the toilet seat, with reference signals obtained
  from a standard 12-lead hospital ECG system.

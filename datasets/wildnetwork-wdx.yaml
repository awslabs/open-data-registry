  - machine learning
License: "Each record carries its own SPDX licence: CC BY 4.0 for contributed WDX detections and derived aggregates; iNaturalist and GBIF records keep their source licences. CC0 and CC BY records are in the main prefixes; CC BY-NC records are kept separately under the noncommercial/ prefix. See the [licensing section](https://github.com/arunrajiah/open-data-examples/blob/main/wildnetwork-wdx/README.md#licensing-and-sources)."
Citation: "Please also cite the WDX format: Rajiah, A. Wildlife Detection Exchange (WDX), doi:10.5281/zenodo.22200864, and credit the underlying observers and sources as their licences require."
Resources:
  - Description: WildNetwork WDX detection events, CC0 and CC BY only (GeoParquet, partitioned by date) and daily and weekly species aggregates per 5-degree grid cell (Parquet), with the WDX JSON Schema and a manifest
    ARN: arn:aws:s3:::wildnetwork-open-data
    Region: us-east-1
    Type: S3 Bucket
  - Description: Detection events and aggregates whose observers chose a non-commercial licence (CC BY-NC 4.0), kept separate from the openly licensed data, with the same layout and columns
    ARN: arn:aws:s3:::wildnetwork-open-data/noncommercial/
    Region: us-east-1
    Type: S3 Bucket

Name: WildNetwork Open Wildlife Detections (Wildlife Detection Exchange, WDX)
Description: |
  WildNetwork is a free, open live map of wildlife detections from community acoustic stations (BirdNET-Pi, BirdNET-Go, the open-hardware WildNetwork Base), AI-classified camera traps and citizen science (iNaturalist, GBIF), covering about 18,800 sensors and 44,000 species worldwide. Every record is a Wildlife Detection Exchange (WDX) event that keeps the species, time and place together with the AI model and version that made the identification, its confidence score, the station's listening effort and a human review status, so users can judge how far to trust each detection. This dataset provides weekly snapshots of openly licensed detection events (with non-commercial records kept in a separate prefix) as GeoParquet, together with daily and weekly counts per species and 5-degree grid cell for studying presence, migration timing and range shifts.
Documentation: https://github.com/arunrajiah/open-data-examples/blob/main/wildnetwork-wdx/README.md
Contact: arunrajiah@gmail.com or https://github.com/arunrajiah/wildnetwork/issues
ManagedBy: "[WildNetwork](https://wildnetwork.arunrajiah.com)"
UpdateFrequency: Weekly snapshots (Mondays, UTC), with a full re-export when the WDX schema version changes
Tags:
  - aws-pds

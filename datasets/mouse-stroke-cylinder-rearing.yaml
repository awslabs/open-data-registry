Name: Longitudinal Cylinder Rearing Behavioral Data in a Mouse Stroke Model Across
  Multiple Drug Treatments
Description: 'This dataset includes longitudinal data from 59 mice assigned to four
  drug treatment groups (lemborexant 10 mg/kg, lemborexant 30 mg/kg, zolpidem 30 mg/kg,
  and vehicle), assessed at five timepoints: baseline (pre-treatment), maximal deficit
  (post-stroke 48 hours), and weeks 2, 4, and 8 post-treatment. Designed to evaluate
  drug efficacy over time, the dataset captures functional or physiological changes
  across stroke acute and recovery phases via the behavioral test of cylinder rearing.
  The shared data specifically comprises 295 video recordings (.mp4) of these sessions,
  paired with corresponding frame-based annotation files (.csv) that classify paw
  usage (left, right, both, or neither) for each frame.'

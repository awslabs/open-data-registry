Name: GHSL global building height estimates (GHS-BUILT-H)
Description: |
  GHS-BUILT-H depicts the depicts the global spatial distribution of building heights extracted from global digital elevation models (DEMs) and Sentinel-2 satellite imagery. The datasets consist of two products: 1) Average of the Net Building Height (ANBH), representing the mean building height per grid cell, in meters, 2) Average of the Gross Building Height (AGBH), in cubic meters per surface unit. The input DEMs are the ALOS World 3D - 30m (2006-2011) and the Shuttle Radar Topography Mission 30m (timestamp 2000). The building heights extracted from these sources are updated using shadow markers extracted from more recent Sentinel-2 imagery for the year 2018 (GHS-composite-S2 R2020A).
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_buH2023.php

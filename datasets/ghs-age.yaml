Resources:
  - Description: "GHS-AGE is available in World Mollweide Equal Area projection (ESRI:54009), at 100 m and 1000 m resolution, and for two levels of temporal resolution (i.e., 5-year and 10-year intervals). Class codes for 10-year intervals: 0: not built-up; 1: median age < 1980; 2: 1980 - 1990, 3: 1990 - 2000, 4: 2000 - 2010, 5: 2010 - 2020. Class codes for 5-year intervals: 0: not built-up; 1: median age < 1975; 2: 1975 - 1980,..., 10: 2010 - 2020."

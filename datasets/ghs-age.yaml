Name: Global gridded estimates of the dominant age of the built stock (GHS-AGE) 
Description: GHS-AGE consists of spatial raster datasets representing global, gridded estimates of the dominant age of the built stock. GHS-AGE has been derived from a multi-temporal stack of gridded estimates of built-up surface (GHS-BUILT-S R2023A, 1975-2020) that has derived from integrated processing of Sentinel-2 and historical Landsat multispectral data. GHS-AGE estimates represent the epoch in which 50% of the built-up surface of 2020 has been exceeded for the first time, for each grid cell. GHS-AGE enables the global, fine-grained modelling of approximate building construction epoch information using a globally consistent methodology.

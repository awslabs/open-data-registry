Resources:
  - Description: ALADIN CZ_1km forecasts as Zarr v3 stores with consolidated metadata, one store per parameter and calendar month, at meteo_data/<YYYYMM>/<PARAMETER>.zarr (e.g. meteo_data/202506/CLSTEMPERATURE.zarr). Dimensions (time, step, latitude, longitude) = (model run, forecast hour, 290, 501), float32, Zstd compression.

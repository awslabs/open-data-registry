Name: ALADIN Czech Republic 1 km Weather Forecasts
Description: Hourly 72-hour numerical weather prediction forecasts for the Czech Republic from the ALADIN limited-area model operated by the Czech Hydrometeorological Institute (ČHMÚ / CHMI), on its 1 km CZ_1km domain (48.5–51.1 °N, 12.0–19.0 °E). Every model run (00, 06, 12 and 18 UTC) is archived with 24 surface and near-surface parameters, including 2 m temperature and humidity, 10 m wind, mean sea level pressure, cloud cover, visibility, precipitation (total, rain, snow, type), snow water equivalent, CAPE, a lightning diagnostic, sunshine duration and surface radiation. ČHMÚ publishes the GRIB files for only a few days; this dataset keeps them as a continuous archive starting in June 2025, converted to cloud-optimized Zarr v3 stores (one store per parameter and calendar month) that can be read directly with xarray without downloading whole files.
Documentation: https://github.com/dandamasek/open-data-examples/tree/main/aladin-cz-forecast
Contact: https://github.com/dandamasek/open-data-examples/issues
ManagedBy: David Sladek
UpdateFrequency: Daily. Once per day the four ALADIN runs (00, 06, 12 and 18 UTC) of the previous day are appended to the store of the current month.

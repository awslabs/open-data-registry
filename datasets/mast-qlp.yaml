Name: QLP
Description: |
  The MIT Quick-Look Pipeline (QLP) light curves are derived from [TESS](https://archive.stsci.edu/missions-and-data/tess) Full Frame Images (FFIs). 
  Quick-Look products provide users an early look at TESS data before final mission products are available at the archive.
Contact: archive@stsci.edu
Documentation: https://archive.stsci.edu/hlsp/qlp
ManagedBy: "[Space Telescope Science Institute](http://www.stsci.edu/)"
Citation: If using this data in published research, visit the [QLP HLSP page](https://archive.stsci.edu/hlsp/qlp) for the appropriate citation.
UpdateFrequency: Hourly
Tags:
  - aws-pds
  - astronomy
License: All HLSPs hosted at MAST are subject to a [CC By 4.0 license](https://creativecommons.org/licenses/by/4.0/).

Name: "NOAA's Coastal Ocean Reanalysis (CORA)"
Description: NOAA's Coastal Ocean Reanalysis (CORA) provides re-analyzed wave and water level data and derived products for the U.S. coastlines. The data are produced by coupling [ADCIRC](https://www.erdc.usace.army.mil/Media/Fact-Sheets/Fact-Sheet-Article-View/Article/476698/advanced-circulation-model/) (ADvanced CIRCulation Model) and [SWAN](https://www.tudelft.nl/en/ceg/about-faculty/departments/hydraulic-engineering/sections/environmental-fluid-mechanics/research/swan) (Simulating WAves Nearshore) and assimilating verified hourly water levels from the National Ocean Service’s [Center of Operational Oceanographic Products & Services](https://tidesandcurrents.noaa.gov/) (CO-OPS).

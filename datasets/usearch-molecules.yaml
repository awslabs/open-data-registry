Resources:
  - Description: |
      Parquet shards under `data/<collection>/parquet/`, one row per entity: compounds with SMILES, MACCS, PubChem, ECFP4 and FCFP4 fingerprints and `.3D.parquet` conformers,
      proteins with sequences, UniProt annotations and `.3D.parquet` Cα traces with pLDDT, and antibody chains and cells with germline calls and run metadata.
      USearch `index-*.safegraphs` graphs sit beside each `parquet/`; start with `data/example/`.
    ARN: arn:aws:s3:::usearch-molecules
    Region: us-west-2
    Type: S3 Bucket

Name: USearch Molecules
Description: |
  USearch Molecules is an open, searchable atlas of chemical and biological entities: the small molecules people make, screen and buy, the proteins they target and the antibodies that bind them.
  Every entity is one Parquet row under a permanent key derived from the entity itself, so a compound or a sequence lands on the same key in every collection that holds it.
  It brings together PubChem, GDB-13 and Enamine REAL compounds, AlphaFold DB protein structures with UniProt annotations, and Observed Antibody Space repertoires,
  with fingerprints, conformers, structures and germline calls beside the rows, and USearch graphs linking each entity to its nearest neighbors.
Documentation: https://github.com/unum-science/USearchMolecules
Contact: ash.vardanian@unum.cloud
ManagedBy: "[Ash Vardanian](https://ashvardanian.com)"
UpdateFrequency: New collections, representations and indexes are added as they are produced; published rows keep their keys.

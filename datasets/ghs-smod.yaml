Name: GHSL Degree of Urbanisation settlement model (GHS-SMOD)
Description: |
  These gridded datasets represent the “Degree of Urbanisation” (DEGURBA) settlement model per 1-km grid cell from 1975 to 2030 in 5-year time steps, derived from the GHS-POP R2023A gridded population estimates and GHS-BUILT-S gridded estimates of built-up surface. The DEGURBA methodology has been endorsed by the UN Statistical Commission and categorizes the Earth's surface into either three broad classes (level 1) or seven more detailed classes (level 2), capturing the spectrum from rural to urban areas. For instance, level one differentiates between urban centres, peri-urban or semi-dense areas, and rural areas. The Degree of Urbanisation method is based on segmentation of gridded population data (GHS-POP R2023A) and gridded built-up surface estimates from GHS-BUILT-S R2023A). These datasets represent the Degree of Urbanisation settlement model at the detailed level 2. The level-1 classification can be obtained by class aggregation. Class codes: 10 (water), 11 (Very low density rural area), 12 (Low density rural area), 13 (Rural cluster), 21 (Suburban or periurban area), 22 (Semi-dense urban cluster), 23 (Dense urban cluster), 30 (Urban centre).
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_smod2023.php

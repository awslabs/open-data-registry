Name: GHS-SMOD
Description: The layers present the application of the Degree of Urbanisation stage I methodology recommended by UN Statistical Commission to the global population grid generated by the JRC in the epochs 1975-2030 (5 years timestep). They have been generated by integration of built-up surface extracted from Landsat and Sentinel-2 image data processing (GHS-BUILT-S R2023), and population data derived from the CIESIN GPW v4.11 (GHS-POP R2023). This product (v2) is an update of the data released in 2023 (v1) based on GHS-BUILT-S, GHS-POP and uses an updated definition of Semi-Dennse Urban Clusters. The Settlement Model is provided at the detailed level (Second Level - L2). First level can be obtained aggregating L2.
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_smod2023.php

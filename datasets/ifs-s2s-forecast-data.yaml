Name: Planette ECMWF IFS S2S Reforecast Data
Description: |
  Global IFS-CY49R1 S2S reforecasts: 10-member ensemble, 46-day lead, 1.5° atmosphere/surface and 1° ocean, 2006–2025.

  This dataset is derived from the ECMWF Data Store (S2S on-the-fly reforecasts) and published by Planette as a single cloud-native Icechunk/Zarr data cube at s3://planette-ifs-46-day/reforecasts for efficient analysis with xarray.
Documentation: https://github.com/PlanetteAI/planette_ifs_archive/blob/main/README.md
Contact: kyle.rasch@planette.ai
ManagedBy: Planette.ai
UpdateFrequency: Monthly
Collabs:

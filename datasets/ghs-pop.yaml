Name: GHSL gridded population estimates (GHS-POP)
Description: These gridded datasets depict the distribution of residential population, expressed by number of persons per 100-m and 1-km cell, in 5-year steps from 1975 to 2030, Residential population estimates between 1975 and 2020 and short-term spatially explicit projections to 2025 and 2030 are derived from CIESIN GPWv4.11 data which were disaggregated from census or administrative units to grid cells, informed by the distribution, volume, and classification of built-up areas as mapped in the Global Human Settlement Layer (GHSL) datasets for each point in time.
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_pop2023.php
Contact: JRC-GHSL-DATA@ec.europa.eu

Name: UCSB CHC CHIRPS - dynamical.org Icechunk Zarr
Description: |
    The Climate Hazards Center Infrared Precipitation with Stations (CHIRPS) version 3 combines satellite estimates and station observations into a precipitation record over land.

    These datasets have been translated to cloud-optimized Icechunk Zarr format by [dynamical.org](https://dynamical.org).

    - [UCSB CHC CHIRPS analysis, final](https://dynamical.org/catalog/ucsb-chc-chirps-analysis-final/) - Daily precipitation from the Climate Hazards Center Infrared Precipitation with Stations (CHIRPS) version 3.0 final product.
    - [UCSB CHC CHIRPS analysis, preliminary](https://dynamical.org/catalog/ucsb-chc-chirps-analysis-preliminary/) - Daily precipitation from the Climate Hazards Center Infrared Precipitation with Stations (CHIRPS) version 3.0 preliminary product.
Documentation: https://dynamical.org/catalog/
Contact: feedback@dynamical.org
ManagedBy: "[dynamical.org](https://dynamical.org)"
UpdateFrequency: "UCSB CHC CHIRPS analysis, final: 1 day; UCSB CHC CHIRPS analysis, preliminary: 1 day"

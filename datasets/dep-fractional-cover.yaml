Name: Digital Earth Pacific Fractional Land Cover (Landsat, 30 m)
Description: |
  Fractional Land Cover represents the percentage of bare soil,
  photosynthetic vegetation, and non-photosynthetic vegetation across the
  Pacific region, derived from multi-mission Landsat surface reflectance
  imagery using spectral unmixing. The dataset supports long-term
  environmental monitoring, land cover change analysis, ecosystem
  monitoring, trend analysis, and land degradation assessment. It
  comprises two products:

  - Scene-based Fractional Land Cover: per-scene estimates of bare soil
    (bs), photosynthetic vegetation (pv) and non-photosynthetic vegetation
    (npv) fractions, plus unmixing error (ue), from 1984 onwards.
  - Annual Summary: yearly statistical summaries (10th, 50th and 90th
    percentiles) of each cover fraction, along with counts of valid
    observations.
Documentation: https://digitalearthpacific.org/#/applications
Contact: dep@spc.int
ManagedBy: "[Pacific Community (SPC)](https://www.spc.int/)"
UpdateFrequency: Scene-based data is added as new Landsat scenes are acquired; summaries are updated annually

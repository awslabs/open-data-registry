Name: "The MIT ROSMAP Single-Nucleus Multiomics Study (MIT_ROSMAP_Multiomics)"

Description: |
  The MIT ROSMAP Single-Nucleus Multiomics Study provides single-nucleus
  transcriptomic and chromatin accessibility data generated from postmortem
  brain tissue from participants in the Religious Orders Study and Rush Memory
  and Aging Project (ROSMAP). The study includes single-nucleus RNA sequencing,
  single-nucleus ATAC sequencing, and paired multiome data from 427 prefrontal
  cortex samples, as well as single-nucleus RNA sequencing data from multiple
  brain regions. These data support investigation of cell-type-specific
  molecular changes, cellular vulnerability, cognitive resilience, and
  Alzheimer's disease progression.


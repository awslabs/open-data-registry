Name: GHSL World Urbanisation Prospects projected gridded population estimates (GHS-WUP-POP)
Description: Spatially explicit, gridded projections of human population from 1975 to 2100 at 1 km spatial resolution, reported as persons per sqkm in 5-year intervals. Residential population estimates between 1975 and 2020 are derived from raw global census data harmonized by CIESIN for the Gridded Population of the World (GPWv4.11) dataset, combined with population trends obtained from the urban agglomeration time series of the UN World Urbanisation Prospects 2018 (UN WUP 2018 – F22). The population projections for 2025 to 2100 are computed according to the 2000-2020 local growth rates in subnational functional areas converging to the projected national growth rates for 2100 (UN World Population Prospects, 2024) and are downscaled to 1-km grid cells using the CRISP methodology.
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_wup_pop_r2025a.php

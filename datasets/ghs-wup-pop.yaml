Resources:
  - Description: Gridded datasets in World Mollweide projection (EPSG:54009) at 1 km spatial resolution; also available in WGS 1984 (EPSG:4326) at 30 arcsecond spatial resolution, globally from 1975 to 2100 in 5-year steps. Grid cell values represent the projected distribution of human population, in number of persons per cell.

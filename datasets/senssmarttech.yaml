Name: SensSmartTech database of cardiovascular signals synchronously recorded by ECG,
  PCG, PPG and accelerometer
Description: 'The SensSmartTech database comprises cardiovascular signals synchronously
  recorded by electrocardiograph (ECG), phonocardiograph (PCG), photoplethysmograph
  (PPG) and accelerometer (ACC) at heart rates at rest and after activity (HRs). It
  is composed of 338 30-s recordings taken from 32 healthy volunteers. Recordings
  contain information from 10 channels: 4 ECG (limb, V3 and V4 leads), 1 PCG (measured
  at heart apex), 4 PPG (measured at carotid and brachial arteries at two light wavelengths
  each) and 1 ACC (measured between V3 and V4 ECG electrodes), along with the recording
  time of each signal. The original recordings are stored in CSV format. Resampled
  recordings are stored in WFDB format. The large HR range with the average minimum
  on the set of 83 ± 11 bpm and the average maximum on the set of 143 ± 14 bpm, along
  with several recordings per heart relaxation period, enable studying of the cardiovascular
  dynamics and gaining insights into the corresponding cardio-respiratory and electro-mechanical
  couplings. Of particular clinical significance are the opportunities to derive corrections
  of multiparameter biomarkers for HR.'

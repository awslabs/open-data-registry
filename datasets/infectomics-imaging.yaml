Name: Infectomics Imaging
Description: |
  Infectomics Imaging is a live-cell imaging atlas of how cell and organelle
  morphology change during viral infection. It is one of three parts of the
  infectomics resource: the Organelle Box cell lines, this imaging release, and
  DynaCell, the deep learning framework that profiles and aligns the dynamic
  cellular responses. Together they let researchers model how perturbations
  rewire cellular organization.

  The release holds 62 imaging acquisitions, recorded between 2023-09-21 and
  2026-09-25. Each is an OME-Zarr store (OME-NGFF 0.5 on Zarr v3) laid out as a
  high-content screening plate, one 5D (T, C, Z, Y, X) array per field of view:
  7,845 fields of view and about 302 TB in all. Every acquisition also has a
  maximum-intensity-projection companion store (suffix "_mip", 4.3 TB in all)
  for fast browsing and for 2D analysis.

  Two microscopes contribute. The Mantis correlative label-free and light-sheet
  fluorescence microscope (v1 and v2; 33 acquisitions, 1,413 fields of view,
  255 TB) follows single cells every 30 minutes through infection. An Andor
  Dragonfly spinning-disk confocal with brightfield (29 acquisitions, 6,432
  fields of view, 47 TB) screens the whole cell-line panel every 6 hours.

  Each field of view pairs a 3D phase volume, reconstructed from the brightfield
  z-stack with waveorder, with the fluorescence channels: the well's GFP-tagged
  organelle marker, an mCherry protease sensor of infection where one is
  present, and Cytoland virtual-stain predictions of the nucleus and the cell
  membrane.

  The biology is live A549 human lung adenocarcinoma cells (ATCC CCL-185), each
  well carrying one GFP-tagged organelle or cell-state marker, imaged under
  Dengue virus, Zika virus and herpes simplex virus 1 infection, and under the
  antiviral MK-0608, bafilomycin A1, oligomycin A and DMSO vehicle. Counted by
  field of view: 1,642 Zika, 1,577 Dengue, 896 herpes simplex 1, 9 OC43, 2,316
  uninfected, 9 mock, 523 vehicle, 396 MK-0608, 36 bafilomycin A1, 36
  oligomycin A, and 880 in the fixation and quality-control references, which
  carry no perturbation record. 475 fields received a drug and a virus together
  and so are counted under both, which is why these counts sum to 8,320 rather
  than to the 7,845 fields of view. The "organelle_box_v2" store is the
  cell-line reference: 23
  GFP-tagged lines imaged live and after methanol and paraformaldehyde fixation,
  773 fields of view. Two further stores, "mantis_figure_4" and
  "mantis_figure_5", hold HEK293T OpenCell endogenous-tag panels, the second
  under human coronavirus OC43; these two carry a noncommercial license, stated
  in the License field below.

  Every store carries machine-readable curation metadata in
  tables/obs/obs.parquet: one row per field of view giving the marker, the
  condition, the perturbation with its NCBI Taxonomy or PubChem identifier, the
  microscope and its time increment, the voxel size, the cell line with its
  Cellosaurus identifier, and the provenance of each annotated value. The stores
  are read with iohub (https://github.com/Biohub/iohub) or with any
  OME-NGFF reader; HTTP range requests let a client stream single slices without
  downloading a store.

Name: Korean Variant Archive 3 (KOVA3)
Description: |
  KOVA3 is a population-scale whole-genome reference for Korean and East Asian genomics, derived from
  10,988 Korean whole genomes jointly genotyped on GRCh38 with the Illumina DRAGEN iterative gVCF
  genotyper. East Asians account for only 2.78% of gnomAD v4, and Koreans are genetically distinct from
  Chinese and Japanese populations, so variants common in Koreans are often absent or imprecisely
  estimated in broader reference databases.

  The dataset is released in two tiers. The open tier is a registration-free allele-frequency resource of
  approximately 100-115 million variants, published as chromosome-sharded sites-only VCF with tabix
  indexes, Apache Parquet partitioned for Amazon Athena, and a prebuilt Hail Table, with allele count,
  allele number, allele frequency, homozygote count, call rate, filter status and callable-region
  resources. The controlled-access tier holds participant-level FASTQ, CRAM, per-sample gVCF and the
  genotyped multi-sample VCF, available to approved academic researchers under the KOVA3 Data Use
  Agreement.

  The open tier supports population-matched rare-disease variant filtering, ACMG/AMP population-frequency
  evidence, carrier-frequency estimation, pharmacogenomics and comparative population genetics. The
  controlled tier supports haplotype phasing and linkage disequilibrium, imputation-reference
  construction, relatedness and fine-scale population structure, variant-caller benchmarking, and
  structural-variant and short-tandem-repeat method development.
Documentation: https://github.com/KuChoiLab/kova3
Contact: https://github.com/KuChoiLab/kova3/issues
ManagedBy: "[Choi Lab, Korea University College of Medicine](https://choi.korea.ac.kr/)"
UpdateFrequency: |
  Growth is stepwise rather than continuous. A new release is produced when a cohort is incorporated and
  the joint callset is regenerated; the next release, planned within the coming year, adds approximately
  2,500 genomes. Published release paths are immutable and superseded releases are retained.

License: |
  The open tier is released under the Creative Commons Attribution 4.0 International license
  (CC BY 4.0), https://creativecommons.org/licenses/by/4.0/. Access requires no registration, approval,
  data-use agreement, payment or AWS account.

  The controlled-access tier is available free of charge to eligible academic researchers for
  non-commercial research under the KOVA3 Data Use Agreement. Eligibility criteria, application
  materials, review procedures and the agreement terms are published at
  https://github.com/KuChoiLab/kova3/blob/main/docs/data-access.md
Citation: |
  Cite the resource and state the release version used, for example "KOVA3 open tier release v3.0.0".
  Allele frequencies change between releases, so an analysis is not reproducible without the version.
  Full citation guidance, including the references for the contributing cohorts, is at
  https://github.com/KuChoiLab/kova3/blob/main/CITATION.md
  A KOVA3 publication citation will be added here on publication.
Resources:
  - Description: |
      Open tier. Aggregate allele-frequency callset for 10,988 Korean whole genomes: chromosome-sharded
      sites-only VCF with tabix indexes, Apache Parquet partitioned by chromosome and genomic-position
      bin, a prebuilt Hail Table, callable-region and allele-number resources, aggregate cohort metadata,
      documentation, schemas, release manifests and SHA-256 checksums. Contains no participant-level
      genotypes.
    ARN: arn:aws:s3:::kova3-open
    Region: ap-northeast-2
    Type: S3 Bucket
  - Description: |
      Controlled-access tier. Participant-level data for the same 10,988 genomes: gzip-compressed
      paired-end FASTQ, CRAM with CRAI indexes, bgzip-compressed per-sample gVCF with tabix indexes, and
      the chromosome-sharded genotyped multi-sample VCF. Read-level format varies by sample; per-sample
      manifests record which format is available for each genome. Access requires an approved application
      and a signed Data Use Agreement.
    ARN: arn:aws:s3:::kova3-controlled
    Region: ap-northeast-2
    Type: S3 Bucket
    ControlledAccess: https://github.com/KuChoiLab/kova3/blob/main/docs/data-access.md

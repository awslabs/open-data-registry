Name: Digital Earth Africa Sentinel-3 SLSTR Land Surface Temperature
Description: |
  Digital Earth Africa (DE Africa) provides free and open access to Sentinel-3 SLSTR Level-2 Land Surface Temperature data over Africa. These products are generated through the European Space Agency (ESA) land processing branch of the Copernicus Sentinel-3 mission. The Sentinel-3 mission, jointly operated by ESA and the European Organisation for the Exploitation of Meteorological Satellites (EUMETSAT), monitors the Earth’s oceans and land surfaces. Sentinel-3A and Sentinel-3B were launched in February 2016 and April 2018, respectively. Both satellites carry the Sea and Land Surface Temperature Radiometer (SLSTR), which acquires observations for monitoring surface temperature and environmental change. The SLSTR Level-2 Land Surface Temperature product provides temperature estimates at approximately 1 km spatial resolution, with an approximately daily revisit frequency when observations from Sentinel-3A and Sentinel-3B are combined. Revisit frequency does not guarantee valid daily observations, as cloud cover affects data availability. Land surface temperature is retrieved using a split-window algorithm applied to thermal infrared observations near 11 and 12 µm. The processing accounts for atmospheric effects and surface emissivity through information on atmospheric water vapour, viewing geometry, land cover and vegetation. The product also includes uncertainty estimates and quality flags to support filtering and interpretation. Further details are available in the SLSTR processing documentation.

Documentation: https://docs.digitalearthafrica.org/en/latest/data_specs/Sentinel-3_Land_Surface_Temperature_specs.html

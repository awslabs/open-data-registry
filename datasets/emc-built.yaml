Resources:
  - Description: EMC built-up surface raster layer in World Mollweide (EPSG:54009) at 10m, 100m and 1000m spatial resolution; also available in WGS 1984 (EPSG:4326) at 3 and 30 arcsecond spatial resolution, globally for the year 2022.    
    ARN: arn:aws:s3:::jrc-ghsl/emc-built-s
    Region: eu-central-1
    Type: S3 Bucket
    Explore:
      - '[Browse Bucket](https://jrc-ghsl.s3.amazonaws.com/index.html)'
  - Description: EMC “non-residential” (NRES) built-up surface raster layer in World Mollweide (EPSG:54009) at 10m, 100m and 1000m spatial resolution; also available in WGS 1984 (EPSG:4326) at 3 and 30 arcsecond spatial resolution, globally for the year 2022.
    ARN: arn:aws:s3:::jrc-ghsl/emc-built-s-nres
    Region: eu-central-1
    Type: S3 Bucket
    Explore:
      - '[Browse Bucket](https://jrc-ghsl.s3.amazonaws.com/index.html)'
  - Description: The EMC Greenness layer represents the Normalized Difference Vegetation Index (NDVI) within and around built-up areas. The gridded data are available in World Mollweide projection (EPSG:54009) at 10m, 100m and 1000m spatial resolution; also available in WGS 1984 (EPSG:4326) at 3 and 30 arcsecond spatial resolution, globally for the year 2022.
    ARN: arn:aws:s3:::jrc-ghsl/emc-built-greenness
    Region: eu-central-1

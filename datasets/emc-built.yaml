Name: Exposure Mapping Component (EMC) EMC-BUILT
Description: The EMC-BUILT product consists of three datasets, including EMC-BUILT-S (gridded built-up surface estimates), EMC-BUILT-S-NRES (non-residential built-up surface estimates) and EMC-BUILT-GREENNESS (NDVI within and nearby the built-up domain). This global dataset has been produced for the year 2022 and is based on Sentinel-2 multispectral data.
Documentation: https://human-settlement.emergency.copernicus.eu/emc_built_s.php
Contact: JRC-GHSL-DATA@ec.europa.eu
ManagedBy: "[JRC](https://joint-research-centre.ec.europa.eu)"
UpdateFrequency: NA

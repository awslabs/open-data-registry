Name: "HeritageGraph: Open Knowledge Graph Dataset for Cultural Heritage"
Description: |
  HeritageGraph is an open RDF knowledge graph dataset for cultural heritage, modelled with the HeritageGraph
  ontology, which is aligned with CIDOC-CRM, PROV-O and GeoSPARQL. Its first use case is Nepal: release v1.0.0
  covers 1,652 monuments of Nepal, including temples, patis and sattals (rest houses), Buddhist monastic
  buildings, stone water spouts (dhunge dhara) and chaityas. For each monument it records names in English and Nepali, identifiers, coordinates, administrative location,
  architectural style (linked to the Getty Art & Architecture Thesaurus), roof and brick types, condition and
  identified threats, the events in its history (5,098 events: production, destruction, transfer of custody,
  consecration and other ritual events), the 7,154 objects it houses (murtis, paubhas, architectural elements),
  and its main deity and religious tradition. The Nepal graph is built from the monument records of the Digital
  Archive of Nepalese Arts and Monuments (DANAM), Heidelberg University, and every monument links back to the
  DANAM page it was derived from. Each release is published as RDF Turtle, JSON-LD and gzipped N-Triples (about 221,000
  triples), with a DCAT/Schema.org metadata file and SHA-256 checksums.

Name: Subspatial Cryo-Electron Tomography Open Data (EMPIAR-11830)
Description: >-
  Subspatial hosts cloud-accessible cryo-electron tomography (cryo-ET) datasets
  on Amazon S3 for integrative structural cell biology and method development.
  The initial release provides the Chlamydomonas reinhardtii in situ cryo-ET
  dataset (EMPIAR-11830), including raw tilt-series frames and reconstructed
  tomograms across multiple binning and denoising levels (must_bin8, must_bin4,
  cryocare_bin4, and ctf3d_bin4). All files are stored in open, non-proprietary
  formats directly on Amazon S3 for anonymous read access without downloading
  entire archives, enabling reproducible cloud-native workflows and machine
  learning benchmarking.
Documentation: https://github.com/subspatial-org/open-data
Contact: https://github.com/subspatial-org/open-data/issues
ManagedBy: "[Subspatial](https://github.com/subspatial-org)"
UpdateFrequency: As new datasets and curated releases become available.

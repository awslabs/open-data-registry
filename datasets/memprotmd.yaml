Name: "MemProtMD: Membrane Proteins in Self-Assembled Lipid Bilayers"
Description: |
  MemProtMD is a database of every membrane protein structure in the Protein Data Bank (PDB), each inserted into a lipid bilayer by coarse-grained molecular dynamics self-assembly. For each structure, a DPPC bilayer assembles around the protein over 1 µs with the MARTINI force field, and the final frame is converted to atomistic detail. The dataset covers about 9,500 structures. For each one it gives coarse-grained and atomistic snapshots of the protein in its membrane, and the bilayer thickness next to the protein and far from it. It also gives per-residue depth in the membrane and contacts with lipid head groups, lipid tails and water, rendered images, and GROMACS inputs to rerun each simulation. Catalogue tables (TSV and Parquet) summarise every simulation and every residue, for large-scale analysis and machine learning of how proteins sit in membranes.
Documentation: https://github.com/stansfeldlab/stansfeldlab.github.io/blob/main/open-data/memprotmd/README.md
Contact: https://stansfeldlab.github.io/memprotmd/#/about
ManagedBy: "[Stansfeld Research Group, University of Warwick](https://stansfeldlab.github.io/)"
UpdateFrequency: New membrane protein structures are simulated as the PDB releases them, typically weekly.

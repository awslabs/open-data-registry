Name: Downing Herbarium - Macquarie University
Description: The Downing Herbarium at Macquarie University (Sydney) houses more than 5,000 specimens of bryophytes (mosses, liverworts, and hornworts from 142 different families) and 11,000 vascular plant specimens collected over a more than 70-year period (1947–2026). Specimens included are from all Australian states, New Zealand, Antarctica, and islands in the subantarctic regions. The collection is curated and systematically organised. We received an ALA (Atlas of Living Australia) grant todigitise the collection and make the specimens available to researchers worldwide. A representative subset including at least one specimens from each species (~2000) is included here.

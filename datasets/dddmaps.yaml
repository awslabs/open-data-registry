Name: Dynamical Density Delay Maps
Description: This project contains Matlab functions for visualizing the behavior of
  complex systems by means of the dynamical density delay mapping ("D3-Map") technique
  . This simple-to-implement visualization method provides an animated representation
  of a system's dynamics.

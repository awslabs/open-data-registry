Name: GHSL World Urbanisation Prospects Projected Degree of Urbanisation (GHS-WUP-DEGURBA)
Description: |
  These gridded datasets represent the “Degree of Urbanisation” (DEGURBA) settlement classification per 1-km grid cell from 1975 to 2100 in 5-year time steps, derived from the GHS-WUP-POP gridded population projections. The DEGURBA methodology classifies human settlements into three to seven classes along the rural-urban continuum and provides a globally consistent way to delineate cities, towns, sub- and periurban settlements, villages, and scattered rural settlements. Class codes: 10 (water), 11 (Very low density rural area), 12 (Low density rural area), 13 (Rural cluster), 21 (Suburban or periurban area), 22 (Semi-dense urban cluster), 23 (Dense urban cluster), 30 (Urban centre).
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_wup_degurba_r2025a.php

Name: Spatial Atlas of Human Anatomy (SAHA)
Description: |
  The Spatial Atlas of Human Anatomy (SAHA) is a multimodal, subcellular-resolution
  spatial reference atlas of human tissues. This release holds 12.4M cells from 115
  donor cores across 10 organs, in 126 acquisitions over 19 runs on the CosMx and
  Xenium platforms, with matched RNA (up to 19,000 genes) and protein (64 markers)
  measured on the same tissue. Organs include appendix, colon, rectum, ileum,
  stomach, pancreas, liver, lymph node, bone marrow and prostate, together with
  disease samples (colorectal cancer, prostate cancer, pancreatic ductal
  adenocarcinoma, and inflammatory bowel disease).
  Most slides are tissue microarrays carrying 2-28 donor cores, so donor identity
  is recorded per cell in obs['donor_core'] rather than per sample; join it to
  donors.parquet. samples.parquet deliberately carries no scalar donor_id -- a
  slide is not a donor. See docs/DATA_DICTIONARY.md.
  Data formats are SpatialData zarr objects (the primary format, one per
  acquisition), raw CosMx flat files, and Parquet metadata tables queryable via
  Amazon Athena.
Documentation: https://github.com/saha-project/saha-data-access
Contact: https://www.saha-project.org/
ManagedBy: "[Mason Lab, Weill Cornell Medicine](https://masonlab.org/)"
UpdateFrequency: As data from new donors and tissue types are processed and validated.

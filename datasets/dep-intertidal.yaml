Name: Digital Earth Pacific Intertidal Elevation and Exposure (Sentinel-2/Landsat, 30 m)
Description: |
  This dataset provides spatial information on intertidal elevation and
  exposure across Pacific Island coastlines derived from multi-sensor
  satellite observations. It includes elevation estimates and exposure
  metrics indicating the proportion of time areas are exposed within the
  intertidal zone. The dataset supports coastal monitoring, habitat
  mapping, and shoreline dynamics analysis.

  It is produced by combining Landsat and Sentinel observations to model
  intertidal elevation and calculate exposure metrics.
Documentation: https://digitalearthpacific.org/#/applications

Name: UKCP18 Global climate projections
Description: |
   Global climate model projections, including 15 from the Met Office Hadley Centre (PPE-15, Perturbed Physics Ensemble) and 13 from other international climate modelling centres (CMIP5-13), together with their derived products: European circulation indices and UKCP18 Derived Projections. The global projections are available in the RCP2.6 and RCP8.5 emissions scenarios and from 1900-2100. The data is available for the entire globe, at daily and monthly temporal resolutions on a N216 Gaussian grid. The data is also available at UK-scale, at daily, monthly, seasonal and annual resolutions on a 60km OSGB grid, for major UK river catchments, administrative regions and each of the countries of the United Kingdom. The data has been converted to cloud-optimised Zarr v3 data stores.

Name: Probabilistic Forecasts of Global Human Modification, 2025-2040
Description: |
  Global probabilistic forecasts of cumulative Human Modification (HM) of terrestrial ecosystems
  at ~1 km resolution for 2025, 2030, 2035 and 2040, with the observed 1990-2020 HM record on the
  same grid. HM is a continuous 0-1 index combining 16 anthropogenic threats mapped to the IUCN
  threat taxonomy. Each land pixel has a full forecast distribution (64 quantiles per year)
  from a convolutional LSTM trained on the 1990-2020 HM time series, so users can estimate
  expected change, uncertainty, and the probability of crossing thresholds such as loss of
  natural land (HM > 0.1).
  <br /><br />

  The forecasts were produced by The Nature Conservancy to support anticipatory conservation
  planning, for example siting protected and conserved areas under Target 3 of the
  Kunming-Montreal Global Biodiversity Framework, assessing conservation additionality, and
  providing forward-looking inputs to biodiversity and ecosystem condition models. Out-of-sample
  forecasts outperform a persistence baseline at every horizon (CRPS skill 0.16-0.30), and their
  95% prediction intervals contain 92-96% of held-out observations.
  <br /><br />

  Data are provided as a single [Icechunk](https://icechunk.io) repository of Zarr v3 arrays
  in EPSG:4326 at 0.009 degrees, covering land from 84°N to 70°S. The repository contains two
  groups: `hm_prob_forecast` (dimensions year, percentile, latitude, longitude) and
  `hm_observed` (dimensions year, latitude, longitude). Values are stored as uint16 with CF
  scale_factor and fill-value attributes, which xarray decodes to HM on the 0-1 scale. Each
  chunk holds all 64 percentiles for a 256 x 320 pixel window, so one read returns complete
  pixel distributions.
  <br /><br />

  The data can be opened anonymously with [Icechunk](https://icechunk.io) and
  [Xarray](https://xarray.dev):
  <br /><br />
  ```python
  import icechunk
  import xarray as xr

  storage = icechunk.s3_storage(
      bucket="tnc-human-modification",
      prefix="hm_probability_forecast",
      region="us-west-2",
      anonymous=True,
  )
  repo = icechunk.Repository.open(storage)
  session = repo.readonly_session(branch="main")
  forecast = xr.open_zarr(session.store, group="hm_prob_forecast", consolidated=False, chunks=None)
  observed = xr.open_zarr(session.store, group="hm_observed", consolidated=False, chunks=None)
  ```
  <br /><br />

  Forecasts are conditional on the continuation of historical relationships and dynamics, and
  pixel distributions are estimated independently. Expected values and exceedance
  probabilities can be aggregated over regions, but percentile maps cannot. See the
  documentation for guidance. Single-band GeoTIFFs of summary layers are also available from
  [Zenodo](https://doi.org/10.5281/zenodo.19700998), and an interactive browser is available on
  the [Earthmover Data Marketplace](https://app.earthmover.io/marketplace/6abb60fba504351ef2a29c6f).

Name: DynaCell Evaluation Suite
Description: |
  The DynaCell evaluation suite assesses dynamic 3D virtual staining of live cells.
  This evaluation suite is part of DynaCell, a broader framework for image-based
  profiling of cell-state dynamics. The dataset pairs label-free transmitted-light
  volumes (brightfield z-stacks and phase reconstructed from them) with fluorescence
  ground truth for four organelles (nucleus, cell membrane, endoplasmic reticulum,
  mitochondria). Both components below are split into train and test sets.

  The biohub-a549 component contains 3D time-lapse images of A549 human lung
  adenocarcinoma cells acquired on the Mantis correlative label-free and light-sheet
  fluorescence microscope at Biohub, across three conditions (uninfected,
  Zika-infected, Dengue-infected): 24 OZX stores (4 organelle markers x 3 conditions
  x 2 splits), 262 FOVs, ~620 GB.

  The aics-hipsc component contains WTC-11 human induced pluripotent stem cells from
  the Allen Institute hiPSC single-cell image dataset (Viana et al., Nature 2023),
  reprocessed as paired label-free and spinning-disk confocal fluorescence volumes:
  6 OZX stores, 1,723 FOVs, ~309 GB. This component is redistributed under the Allen
  Institute Terms of Use (https://www.allencell.org/terms-of-use.html), which require
  citation of the original dataset and limit use to noncommercial research.

  The bucket also holds the trained baseline model checkpoints with their training
  configs, a small demo bundle, per-FOV quality-control reports for the A549 stores,
  supplementary movies, and the data behind the project website's interactive viewer.

  All data are stored as RFC-9 zipped OME-Zarr (.ozx) archives following OME-NGFF v0.5,
  readable with iohub (https://github.com/Biohub/iohub). Machine-readable metadata
  (Croissant 1.1 JSON-LD with Responsible AI fields) is published at
  s3://dynacell/v1/metadata/croissant.json.

Resources:
  - Description: |
      MESA version 1 (prefix mars/mesa/v1/): the global 18 m DEM with its provenance mask and flags (three COGs of
      1,185,494 x 592,747 pixels, float32 and uint8), the uncertainty layer (four global COGs on the same grid:
      median error, 90th-percentile error, class, seam errors), the image footprint layer (per-tile image-index
      and overlap-depth COGs for 648 tiles of 10 x 10 degrees, image tables as CSV, footprint polygons as
      GeoPackage), the 6 m CTX image mosaic (one COG of 3,556,482 x 1,778,241 pixels, uint8), a STAC 1.1 catalog,
      SHA-256 checksums, and documentation.

Name: MESA - Mars Elevation from Shading and Altimetry, an 18 m global digital elevation model of Mars
Description: |
  MESA (Mars Elevation from Shading and Altimetry) is a global digital elevation model (DEM) of Mars on an
  18 m grid. Elevation is predicted from single Context Camera (CTX) images by a neural network trained on
  2,817 CTX stereo DEMs. The other inputs are the Mars Orbiter Laser Altimeter (MOLA) gridded DEM, the direction
  of the Sun, and the distance to the nearest MOLA laser shot. Predictions from 48,002 CTX images acquired
  between 2006 and 2025 are leveled to the MOLA laser shots and joined into one surface. 97.6% of Mars is
  predicted from images. 2.3% is infilled and marked in the provenance mask. Against 618 HiRISE stereo DEMs the median
  per-DEM mean absolute error of the predicted pixels is 8.5 m, compared with 18.0 m for the 463 m MOLA gridded
  DEM (11.2 m against 19.2 m at 359 held-out CTX stereo DEMs). The release contains the DEM with its provenance
  mask and flags as single global Cloud-Optimized GeoTIFFs (COG), a global per-pixel uncertainty layer (typical
  and 90th-percentile elevation error, an uncertainty class, and seam errors), an image-footprint layer that
  identifies the CTX image and acquisition date behind each pixel, a 6 m mosaic of the CTX images used for
  prediction, and a STAC catalog. All rasters share one projection: equirectangular on the Mars 2015 sphere
  (IAU_2015:49910), planetocentric latitude, longitude -180 to 180. Heights are meters above the MOLA areoid.
Documentation: https://github.com/planetarydems/open-data-examples/tree/main/mesa
Contact: planetarydems@mit.edu
ManagedBy: "[Planetary DEMs, Perron Group and Gaia Lab, Massachusetts Institute of Technology](https://planetarydems.org)"
UpdateFrequency: Static. A new version is published when the model or the mosaic changes. Versions are kept under separate prefixes. Earlier versions are not removed without notice.

Name: ATLAS 2015-16 proton-proton data for research
Description: The 2015 and 2016 data collected by the ATLAS Experiment at the Large Hadron Collider at CERN. The data are provided in a ROOT-based format, PHYSLITE, which is pre-calibrated and suitable for particle physics research. A framework is provided, PhysLiteToOpenData, for processing the PHYSLITE files down into relatively light-weight ntuples. Several notebook examples of data processing are available, along with several example research projects. Please feel free to contact us for help or to discuss a project at https://opendata.atlas.cern/contact-us
Documentation: https://opendata.atlas.cern
Contact: atlas-outreach-opendata-support@cern.ch
ManagedBy: The ATLAS Experiment at CERN
UpdateFrequency: Small additions are possible upon request; data are otherwise static

Name: National Agriculture Imagery Program (NAIP) Acquisitions and County Mosaics
Description: |
  The National Agriculture Imagery Program (NAIP) photographs the continental United States
  from the air during the growing season. This dataset holds NAIP imagery from 2024 onward as
  Cloud-Optimized GeoTIFFs (COGs) with STAC metadata. USDA distributes recent NAIP as county
  mosaics that combine flights up to three months apart under one date. Using USDA's
  seamlines, this dataset cuts those mosaics into acquisitions: one minute of one aircraft's
  flight, each with its own time, for 2024 and 2025. For 2026, whose seamlines are not yet
  published, it also converts the county mosaics to COG. USDA's original county mosaics, in
  MrSID as delivered, are included for every season. Imagery is 4-band (red, green, blue, near-infrared),
  8-bit, at 30 cm or 60 cm. Pixels are those of USDA's county mosaics, which USDA compresses
  about 40:1. For lossless 2010-2023 quarter quads, see NAIP on AWS.
Documentation: https://github.com/EarthLegend/naip-open-data
Contact: aws-ops+naip-ccm@lgnd.ai
ManagedBy: "[LGND](https://lgnd.ai)"
UpdateFrequency: >-
  New imagery is added as USDA delivers it. USDA posts a state's county mosaics three to six
  months after the flying season and its seamlines when the state is complete; acquisitions
  are added when the seamlines arrive. Each state is flown every two to three years.

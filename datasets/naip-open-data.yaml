Name: National Agriculture Imagery Program (NAIP) Acquisitions and County Mosaics
Description: |
  USDA National Agriculture Imagery Program (NAIP) aerial imagery of the continental United
  States, 2024 onward, as Cloud-Optimized GeoTIFFs (COGs) with STAC metadata. USDA's county
  mosaics combine flights up to three months apart under one date; using USDA's seamlines,
  this dataset cuts them into acquisitions, each one minute of one aircraft's flight with its
  own time, for 2024 and 2025. 2026 county mosaics, whose seamlines are not yet published, are
  converted to COG. USDA's original MrSID county mosaics are included for every season.
  Imagery is 4-band (red, green, blue, near-infrared), 8-bit, at 30 cm or 60 cm, from county
  mosaics USDA compresses about 40:1. For lossless 2010-2023 quarter quads, see NAIP on AWS.
Documentation: https://github.com/EarthLegend/naip-open-data
Contact: aws-ops+naip-ccm@lgnd.ai
ManagedBy: "[LGND](https://lgnd.ai)"
UpdateFrequency: >-
  New imagery is added as USDA delivers it. USDA posts a state's county mosaics three to six
  months after the flying season and its seamlines when the state is complete; acquisitions
  are added when the seamlines arrive. Each state is flown every two to three years.

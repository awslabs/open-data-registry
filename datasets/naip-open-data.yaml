Citation: "Imagery: USDA Farm Service Agency, National Agriculture Imagery Program (NAIP)."
Resources:
  - Description: >-
      NAIP acquisitions (2024 and 2025, under naip-acquisitions/) as Cloud-Optimized
      GeoTIFFs, and USDA's original county mosaics (MrSID, 2024 on, under naip-ccm/) with
      COGs for 2026. Each file has a STAC 1.1.0 Item and each COG a PNG thumbnail; the
      static STAC catalog starts at catalog.json. Paths run state/year/ (and
      state/year/YYYYMMDD/ for acquisitions), with a folder per Item. USDA's metadata and
      seamlines sit beside the county mosaics.

Name: Haploblocks
Description: A scalable framework that discretizes the genome into haploblocks (recombination-defined regions) and represents each individual as a compact binary genomic hash for genotype-phenotype mapping. Generated by applying the Genomic Cluster Engine pipeline to the 1000 Genomes Project (GRCh38, genome-wide recombination maps, all autosomes and chromosome X), producing per-chromosome haploblock boundaries, sequence-similarity clusters, and per-individual genomic hashes. Methodology described in Kubica et al. 2025 (BioHackrXiv).
Documentation: https://www.haploblocks.org/
Contact: https://www.haploblocks.org/
ManagedBy: "[Haploblocks Project](https://www.haploblocks.org/)"
UpdateFrequency: Frequently, as additional chromosomes or populations are processed.

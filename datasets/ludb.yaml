Name: Lobachevsky University Electrocardiography Database
Description: Lobachevsky University Electrocardiography Database (LUDB) is an ECG
  signal database with marked boundaries and peaks of P, T waves and QRS complexes.
  The database consists of 200 10-second 12-lead ECG signal records representing different
  morphologies of the ECG signal. The ECGs were collected from healthy volunteers
  and patients of the Nizhny Novgorod City Hospital No 5 in 2017–2018. The patients
  had various cardiovascular diseases while some of them had pacemakers. The boundaries
  of P, T waves and QRS complexes were manually annotated by cardiologists for all
  200 records. Also, each record is annotated with the corresponding diagnosis. The
  database can be used for educational purposes as well as for training and testing
  algorithms for ECG delineation, i.e. for automatic detection of boundaries and peaks
  of P, T waves and QRS complexes.

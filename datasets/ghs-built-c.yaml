Name: GHSL morphological settlement zones and characteristics (GHS-BUILT-C)
Description: GHS-BUILT-C delineates the boundaries of the human settlements at 10m resolution and describes their inner characteristics in terms of the morphology of the built environment and the functional use. These Morphological Settlement Zones (MSZ) delineate the spatial domain of human settlements at a neighboring scale of approx. 100m, based on the spatial generalization of the built-up surfaces. GHS-BUILT-C also includes within-settlement open spaces. MSZ, open spaces, and built spaces class abstractions are derived by morphological spatial filtering and are further classified according to vegetation intensity, water surfaces (GHS_LAND_GLOBE_R2022A), road surfaces (OSM highways), functional use (GHS-BUILT-C_FUN_GLOBE_R2023A), and building height (GHS-BUILT-H_GLOBE_R2023A). The FUN subdataset provides a residential vs. non-residential functional classification of the built domain.
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_buC2023.php

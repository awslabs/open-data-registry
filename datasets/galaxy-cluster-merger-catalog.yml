Name: Galaxy Cluster Merger Catalog
Description: "This catalog provides data from a number of simulations of galaxy clusters and galaxy cluster mergers. Specifically, for each simulation you will find projections of simulated observable quantities of simulated galaxy clusters and cluster mergers. These synthetic observations span a number of wavebands, from millimeter to X-ray. The goal is to provide both observers and theorists in the area of galaxy clusters a resource for comparing simulated data to real observations. The simulation data has been post-processed using yt."
Documentation: https://gcmc.hub.yt
Contact: john.zuhone@cfa.harvard.edu
ManagedBy: Center for Astrophysics | Harvard & Smithsonian
UpdateFrequency: The dataset may be updated with additional or corrected data on a need-to-update basis.
Tags:

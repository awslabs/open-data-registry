  - computational fluid dynamics
  - hdf5
  - simulations
License: CC-BY-4
Citation: "Accessed from the Galaxy Cluster Merger Catalog at https://gcmc.hub.yt (ZuHone et al. 2018, ApJS, 234, 1)"

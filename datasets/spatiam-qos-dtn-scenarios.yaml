Name: Spatiam Corporation DTN Scenario Examples: LEO, Mars, and Lunar Contact Plans
Description: Example DTN (Delay/Disruption-Tolerant Networking) scenario configuration files - contact plans, traffic demand, and node storage capacity - for a Low Earth Orbit constellation, a Mars relay network, and a Lunar communication network, for use in DTN routing and scheduling research.

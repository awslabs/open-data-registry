Name: "The Mount Sinai PsychAD Study (MSSM_PsychAD)"

Description: |
  The Mount Sinai PsychAD Study provides population-scale single-nucleus RNA
  sequencing data from the dorsolateral prefrontal cortex of 1,494 postmortem
  brain donors. The study encompasses more than 6.3 million nuclei from
  individuals with neurodegenerative diseases, serious mental illnesses, and
  neurotypical controls. Represented conditions include Alzheimer's disease,
  Parkinson's disease, schizophrenia, bipolar disorder, diffuse Lewy body
  dementia, vascular dementia, and additional neurological and psychiatric
  disorders. The study also includes genotype, clinical, neuropathological, and
  neuropsychiatric symptom data where available.


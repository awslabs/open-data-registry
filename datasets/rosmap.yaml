Name: "The Religious Orders Study and Memory and Aging Project (ROSMAP) Study"

Description: |
  The Religious Orders Study (ROS) and Rush Memory and Aging Project (MAP) are
  ongoing longitudinal clinical-pathologic cohort studies of aging and
  Alzheimer's disease. Participants enroll without known dementia, undergo
  annual clinical and cognitive evaluations, and agree to organ donation at
  death. The ROSMAP study provides genomic, transcriptomic, epigenomic,
  proteomic, metabolomic, imaging, and related metadata generated from these
  cohorts to support research into cognitive decline, neuropathology, brain
  aging, and the molecular mechanisms of Alzheimer's disease.


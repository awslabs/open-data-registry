Name: Respiratory and Pulse Oximetry Waveforms from Healthy Adults During Simulated
  Apnoea Events
Description: This dataset contains airway gauge pressure, inspiratory differential
  pressure, and pulse oximetry waveforms collected from 20 healthy adult participants
  (10 females, 10 males) during simulated obstructive sleep apnoea (OSA) trials. Recordings
  include photoplethysmography (PPG) signals from a custom neck-worn reflectance oximeter,
  which records both arterial and venous blood waveforms from the carotid artery and
  internal jugular vein, respectively. Each subject completed a a series of 8 × 60-second
  breathing trials with varying positive airway pressures (0, 4, and 8 cmH₂O) set
  with a continuous positive airway pressure (CPAP) device. Normal breathing was recorded
  initially before subsequent trials of three breaths followed by 10- and 20-second
  breath holds, before normal breathing for the rest of the 60 seconds. The dataset
  is structured to support algorithm development and validation for OSA detection,
  modelling of airway resistance and oxygen desaturation responses, and non-invasive
  estimation of arterial and venous oxygen saturation. Supplementary code and figures
  are included to facilitate data analysis.

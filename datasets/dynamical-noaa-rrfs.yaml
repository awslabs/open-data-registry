Name: NOAA RRFS - dynamical.org Icechunk Zarr
Description: |
    The Rapid Refresh Forecast System (RRFS) is a National Oceanic and Atmospheric Administration (NOAA) National Centers for Environmental Prediction (NCEP) convection-allowing weather forecast model with a 3 km grid, built on the Unified Forecast System. The RRFS ensemble (RRFS ENS) adds five perturbed members to this deterministic forecast, and REFS combines both with HRRR into ensemble products.
    
    NOAA RRFS is pre-operational, so expect changes to the model data and to the structure of this dataset.

    These datasets have been translated to cloud-optimized Icechunk Zarr format by [dynamical.org](https://dynamical.org).

    - [NOAA RRFS forecast, sub-hourly, virtual](https://dynamical.org/catalog/noaa-rrfs-forecast-sub-hourly-virtual/) - Weather forecasts from the Rapid Refresh Forecast System (RRFS) operated by NOAA NWS NCEP.
    - [NOAA RRFS forecast, 18 hour, virtual](https://dynamical.org/catalog/noaa-rrfs-forecast-18-hour-virtual/) - Weather forecasts from the Rapid Refresh Forecast System (RRFS) operated by NOAA NWS NCEP.
    - [NOAA RRFS forecast, 84 hour, virtual](https://dynamical.org/catalog/noaa-rrfs-forecast-84-hour-virtual/) - Weather forecasts from the Rapid Refresh Forecast System (RRFS) operated by NOAA NWS NCEP.

Name: Myocardial perfusion scintigraphy image database
Description: This database provides a collection of myocardial perfusion scintigraphy
  images in DICOM format with all metadata and segmentations (masks) in NIfTI format.
  The images were obtained from patients undergoing scintigraphy examinations to investigate
  cardiac conditions such as ischemia and myocardial infarction. The dataset encompasses
  a diversity of clinical cases, including various perfusion patterns and underlying
  cardiac conditions. All images have been properly anonymized, and the age range
  of the patients is from 20 to 90 years. This database represents a valuable source
  of information for researchers and healthcare professionals interested in the analysis
  and diagnosis of cardiac diseases. Moreover, it serves as a foundation for the development
  and validation of image processing algorithms and artificial intelligence techniques
  applied to cardiovascular medicine. Available for free on the PhysioNet platform,
  its aim is to promote collaboration and advance research in nuclear cardiology and
  cardiovascular medicine, while ensuring the replicability of studies.

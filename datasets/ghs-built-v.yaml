Resources:
  - Description: GHS-BUILT-V global gridded building volume estimates in World Mollweide projection (EPSG:54009) at 100m and 1000m spatial resolution; also available in WGS 1984 (EPSG:4326) at spatial resolutions of 3 and 30 arcseconds. Global spatial extent, temporal extent from 1975 to 2030 in 5-year steps.

Name: GHSL global building volume estimates (GHS-BUILT-V)
Description: GHS-BUILT-V depicts the global distribution of building volume from 1975 to 2030, measured in cubic metres per grid cell. The dataset reports both the total building volume and the volume of predominantly non-residential (NRES) structures.
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_buV2023.php
Contact: JRC-GHSL-DATA@ec.europa.eu
ManagedBy: "[JRC](https://joint-research-centre.ec.europa.eu)"
UpdateFrequency: NA

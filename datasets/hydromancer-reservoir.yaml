Name: "Reservoir: Hyperliquid Historical Market Data"
Description: |
  Reservoir is a free archive of Hyperliquid exchange data, built from the chain's public data and stored as Parquet files partitioned by day. It covers every fill (trade) on Hyperliquid's own perpetual markets, spot markets, HIP-3 venues and HIP-4 prediction markets from July 2025, plus 1-second candles, daily snapshots of every open position, spot balance and account value, and 1-minute order book snapshots (top 20 levels). It is updated daily.

  #### Datasets

  | Dataset | Path | Starts |
  | --- | --- | --- |
  | Every fill on every venue | `s3://hydromancer-reservoir/global/fills/raw/` | 28 Jul 2025 |
  | Perp fills by venue, plus liquidations, ADL, TWAP and builder fills | `s3://hydromancer-reservoir/by_dex/{venue}/fills/perp/` | 28 Jul 2025 |
  | Spot fills | `s3://hydromancer-reservoir/global/fills/spot/` | 28 Jul 2025 |
  | HIP-4 prediction-market fills | `s3://hydromancer-reservoir/global/fills/outcome/` | 2 May 2026 |
  | 1-second candles | `s3://hydromancer-reservoir/global/candles/1s/` | 31 Jul 2025 |
  | Position, spot balance and account value snapshots | `s3://hydromancer-reservoir/global/snapshots/` | 29 Jul 2025 (some days missing) |
  | Order books, 20 levels, every minute | `s3://hydromancer-reservoir/by_dex/{venue}/orderbook/1m/` | 15 Dec 2025 |
Documentation: https://docs.hydromancer.xyz/reservoir
Contact: data@hydromancer.xyz
ManagedBy: "[Hydromancer](https://hydromancer.xyz)"
UpdateFrequency: Daily. Each UTC day is added the following day, around 10:00 to 12:00 UTC.

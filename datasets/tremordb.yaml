Name: Effect of Deep Brain Stimulation on Parkinsonian Tremor
Description: The recordings of this database are of rest tremor velocity in the index
  finger of 16 subjects with Parkinson's disease (PD) who receive chronic high frequency
  electrical deep brain stimulation (DBS).

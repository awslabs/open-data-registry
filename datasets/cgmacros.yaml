Name: 'CGMacros: a scientific dataset for personalized nutrition and diet monitoring'
Description: We present CGMacros, a dataset containing multimodal information from
  two continuous glucose monitors (CGM), food macronutrients, food photographs, and
  physical activity, in addition to anonymized participant demographics, anthropometric
  measurements and health parameters from blood analyses and gut microbiome profiles.
  CGMacros contains data from 45 study participants (15 healthy adults, 16 with pre-diabetes,
  and 14 with Type 2 diabetes) who consumed meals with varying and known macronutrient
  compositions in a free-living setting for ten consecutive days. To our knowledge,
  this is the first database of its kind to be made publicly available. CGMacros,
  and larger publicly available datasets that we hope may follow, are essential to
  democratize academic research in personalized nutrition and algorithmic approaches
  to automated diet monitoring.

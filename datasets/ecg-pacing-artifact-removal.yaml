Name: Automated Detection and Removal of Pacing Artifacts from ECG Signal
Description: 'Pacing artifacts in electrocardiogram (ECG) signals can interfere with
  accurate waveform analysis, making their detection and removal essential for reliable
  interpretation. We present an algorithm and provide MATLAB code to detect and remove
  pacing artifacts from raw digital 12-lead ECG recordings. The algorithm was developed
  using the Chronic Renal Insufficiency Cohort (CRIC) data, which includes 493 paced
  ECGs, and validated on an external dataset (273 paced ECGs). A graphical user interface
  (GUI) was designed to allow user-friendly quality control of automated algorithm
  performance. Users can adjust settings to achieve the desired result: complete removal
  of the pacing spike without removing the ECG waveform. The algorithm automatically
  detected and removed pacing artifacts in 82.8% of the 10-second ECG files in the
  validation set, while the remaining files required user input. The overall sensitivity
  and specificity for pacing artifact detection were 98.4% and 76.5%, respectively.
  In summary, the proposed algorithm effectively detects and removes ECG pacing artifacts
  with high automation, thereby minimizing the need for manual fine-tuning.'

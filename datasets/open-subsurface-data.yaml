Name: Open Subsurface Data
Description: |
  Open subsurface data from public archives, kept as the sources shipped them, byte for byte: 3D post-stack
  seismic volumes and scientific ocean drilling data. The seismic comes from the USGS National Archive of Marine
  Seismic Surveys and South Australia's SARIG. Each survey comes with a JSON summary of its header layout and the
  fixes a reader needs, and index tables tie the Gulf of Mexico surveys to the exploration wells drilled inside
  them and whether those wells found pay. The ocean drilling data are the LDEO LogDB downhole logs and the
  International Ocean Discovery Program community on Zenodo. Release 0.1 holds 3.9 TB: every SARIG 3D survey,
  the NAMSS surveys offshore California and in the Beaufort Sea, 20 depth-migrated Gulf of Mexico surveys,
  downhole logs from 712 DSDP, ODP and IODP holes, and 3,416 IODP records (expedition data from the JOIDES
  Resolution, ODP and DSDP Proceedings volumes, technical notes).
Documentation: https://github.com/mnky9800n/open-subsurface-data/blob/main/docs/dataset.md
Contact: john@veleslabs.ai, or open an issue at https://github.com/mnky9800n/open-subsurface-data/issues
ManagedBy: "[Veles Labs](https://veleslabs.ai)"
UpdateFrequency: New surveys and sources are added in numbered releases, a few times a year. Files already in the bucket do not change.

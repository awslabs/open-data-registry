Name: 'Brugada-HUCA: 12-Lead ECG Recordings for the Study of Brugada Syndrome'
Description: We present a novel dataset of 12-lead electrocardiogram (ECG) recordings
  developed to support the study and classification of Brugada syndrome, a rare but
  potentially fatal cardiac arrhythmia. The data were collected retrospectively from
  patients evaluated at the Cardiology Department of the Hospital Universitario Central
  de Asturias (HUCA) and reviewed by clinical experts. Diagnostic labels were assigned
  according to internationally accepted criteria. The dataset comprises 363 subjects
  in total, including 76 patients diagnosed with Brugada syndrome and 287 healthy
  control subjects. Each recording is accompanied by diagnostic information. This
  resource aims to facilitate the development and validation of machine learning algorithms
  and computational tools for ECG interpretation, supporting improved early detection
  and clinical decision-making. The dataset, fully anonymized in accordance with ethical
  and privacy standards, provides a reproducible foundation for collaborative research
  into Brugada syndrome and related cardiac conditions.

Name: RSNA Intracerebral Hemorrhage, Intraventricular Hemorrhage and Perihematomal Edema CT Segmentation Dataset
Description: "This dataset provides voxel-level segmentations of intracerebral hemorrhage (ICH), intraventricular hemorrhage (IVH) and perihematomal edema (PHE) for 359 non-contrast head CT examinations (357 patients) selected from the RSNA 2019 Intracranial Hemorrhage Detection dataset (https://mira.rsna.org/dataset/1). Each examination is provided as a NIfTI CT volume with a matching three-label NIfTI mask. A team at the Université de Montréal and the Centre hospitalier de l'Université de Montréal (CHUM) created the masks, and the dataset is the training and internal test set of a published, externally tested benchmark model (IIPS), described in Wu et al., Radiology Advances 2026 (https://doi.org/10.1093/radadv/umag036). The 183-examination external test set from CHUM is not included."
Documentation: https://doi.org/10.1093/radadv/umag036
Contact: informatics@rsna.org
ManagedBy: 'Radiological Society of North America (https://www.rsna.org/)'
UpdateFrequency: The dataset may be updated with additional or corrected data on a need-to-update basis.

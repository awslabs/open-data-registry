Name: New York City Taxi and Limousine Commission (TLC) Trip Record Data
Description: "Data of trips taken by taxis and for-hire vehicles in New York City. Note: Direct S3 access via the legacy s3://nyc-tlc bucket is no longer available. Public downloads are accessible directly via NYC TLC's official CloudFront distribution (https://d37ci6vzurychx.cloudfront.net/trip-data/) or from the dataset's documentation webpage listed below."
Documentation: https://www1.nyc.gov/site/tlc/about/tlc-trip-record-data.page
Contact: research@tlc.nyc.gov
ManagedBy: City of New York Taxi and Limousine Commission
UpdateFrequency: As soon as new data is available to be shared publicly.

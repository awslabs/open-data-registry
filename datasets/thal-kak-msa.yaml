License: |
  Each database carries the license of the source it derives from; no database mixes sources.
  [LICENSE.txt](https://thal-kak-msa.s3.amazonaws.com/LICENSE.txt) at the bucket root is the full
  record of upstream licenses, attribution, citation and changes.

  | Archives | License | Source |
  | --- | --- | --- |
  | hhblits/uniref100_2026_01 | [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) | UniProt UniRef100, release 2026_01 |
  | mmseqs/bfd_reduced | [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/) | BFD reduced subset, via the AlphaFold databases |
  | mmseqs/mgnify_clusters, hhblits/mgnify_clusters | [CC0 1.0](https://creativecommons.org/publicdomain/zero/1.0/) | MGnify protein database, release 2024_04 |
  | mmseqs/envhog_std, hhblits/envhog | [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) | EnVhogDB |
  | mmseqs/logan_human, hhblits/logan_human, hhblits/logan_nonhuman | No license is granted. [NCBI Policy](https://www.ncbi.nlm.nih.gov/home/about/policies/) and [NIH Genomic Data Sharing Policy](https://osp.od.nih.gov/scientific-sharing/genomic-data-sharing/) | Logan v1 (SRA cutoff 2023-12-10) |
Citation: >-
  For the pipeline that searches these databases, cite Bae J. et al. Thal-Kak: unifying biomolecular
  structure predictors reveals a sampling-selection gap. bioRxiv 2026.08.19.745680 (2026).
  doi:10.64898/2026.08.19.745680. Also cite the upstream database of each archive you use, as given
  in LICENSE.txt; for the CC BY and CC BY-SA databases this attribution is a license condition.
Resources:
  - Description: >-
      MMseqs2 expandable profile databases, one .tar.zst archive per database (mgnify_clusters,
      envhog_std, bfd_reduced, logan_human). Each archive holds four MMseqs2 databases; build the
      .idx search index after extraction.
    ARN: arn:aws:s3:::thal-kak-msa/mmseqs/
    Region: us-east-1
    Type: S3 Bucket
  - Description: >-
      HH-suite (FFindex) databases, one .tar.zst archive per database (uniref100_2026_01,
      mgnify_clusters, logan_nonhuman, envhog, logan_human). Each archive holds the a3m, hhm and
      cs219 databases.
    ARN: arn:aws:s3:::thal-kak-msa/hhblits/
    Region: us-east-1
    Type: S3 Bucket
  - Description: Notifications for new Thal-Kak Multiple Sequence Alignment Databases data
    ARN: arn:aws:sns:us-east-1:029678959616:thal-kak-msa-object_created
    Region: us-east-1
    Type: SNS Topic

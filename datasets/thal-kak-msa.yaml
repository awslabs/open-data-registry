Name: Thal-Kak Multiple Sequence Alignment Databases
Description: >-
  A collection of prebuilt protein sequence databases for multiple sequence alignment (MSA) search.
  MSAs are the main input of protein structure prediction and are also used to study conservation,
  coevolution and protein function. The nine databases, in the native formats of MMseqs2 and
  HH-suite, derive from UniProt UniRef100 (release 2026_01), the reduced BFD, MGnify (release
  2024_04), EnVhogDB and the Logan protein catalogue from the NCBI Sequence Read Archive. The
  sequences of UniRef100, MGnify and the reduced BFD were re-clustered, EnVhogDB was re-clustered
  at its upstream standard level, and Logan was built into an MMseqs2 expandable-profile database.
  Each database is published as one .tar.zst archive.
  They are set up for Thal-Kak, a pipeline that unifies several structure prediction models, so that
  its local MSA search writes MSAs in the input format of those models.

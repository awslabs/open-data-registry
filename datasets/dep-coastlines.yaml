Name: Digital Earth Pacific Annual Shorelines (Landsat, 30 m)
Description: |
  This dataset provides annual coastline positions across the Pacific
  region derived from Landsat satellite imagery. It captures long-term
  shoreline change by mapping coastal boundaries over time, providing
  insights into processes including erosion (where landmass area
  decreases) and accretion or deposition (where landmass area increases).
  The dataset supports coastal change analysis, erosion monitoring, and
  climate adaptation planning.

  Annual shoreline vectors are extracted and composited from Landsat
  imagery, and are published as a vector time series in both GeoPackage
  and PMTiles formats. A WMTS service is also available at https://tileser
  ver.prod.digitalearthpacific.io/styles/coastlines/wmts.xml.

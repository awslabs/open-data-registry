Name: Digital Earth Pacific Annual Surface Reflectance Composite (Sentinel-2, GeoMAD, 10 m)
Description: |
  This dataset provides annual cloud-free composite imagery derived from
  Sentinel-2 observations across the Pacific region using geometric median
  and absolute deviation (GeoMAD) methods. The geometric median uses a
  more robust method of determining the median observation than a simple
  median, and represents stable surface conditions.

  Along with the median observation, the GeoMAD produces three measures of
  variance, or absolute deviations (emad, smad and bcmad), which help to
  understand how the data change over the time period. For example, some
  areas, such as bare rock, will change very little, whereas crop land
  will change more. The dataset is available annually from 2017 and
  supports monitoring of vegetation, land cover, and coastal environments.

Name: Digital Earth Pacific Vegetation Height, Satellite-Derived Canopy Height (Sentinel-2, 10 m)
Description: |
  This dataset provides spatial estimates of vegetation height across the
  Pacific region derived from Sentinel-2 imagery using modelling
  approaches to estimate vegetation canopy height. It includes height and
  confidence layers from 2020 onwards, enabling quarterly analysis of
  forest structure, biomass, and ecosystem condition. The dataset supports
  applications in land management, carbon monitoring, and biodiversity
  assessment.
Documentation: https://digitalearthpacific.org/#/applications
Contact: dep@spc.int
ManagedBy: "[Pacific Community (SPC)](https://www.spc.int/)"
UpdateFrequency: Quarterly

Name: NOAA URMA - dynamical.org Icechunk Zarr
Description: |
    The Unrestricted Mesoscale Analysis (URMA) is NOAA's analysis of near-surface weather conditions incorporating observations that arrive too late for RTMA. NOAA runs URMA about six hours after analysis time, allowing it to provide a more complete historical analysis than the faster RTMA and RTMA-RU products. URMA serves as the National Weather Service's analysis of record for forecast verification.

    These datasets have been translated to cloud-optimized Icechunk Zarr format by [dynamical.org](https://dynamical.org).

    - [NOAA URMA analysis, virtual](https://dynamical.org/catalog/noaa-urma-analysis-virtual/) - Hourly Unrestricted Mesoscale Analysis (URMA) operated by NOAA NWS NCEP on the native CONUS grid, incorporating observations received after the RTMA analysis.
Documentation: https://dynamical.org/catalog/

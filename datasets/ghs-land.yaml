  - cog
  - disaster response
  - earth observation
  - geoscience
  - geospatial
  - global
  - land
  - mapping
  - planetary
  - surface water
  - tiff
  - tiles
License: GHSL data are provided under the Creative Commons Attribution 4.0 International (CC BY 4.0) license.
Resources:
  - Description: The GHSL gridded land surface raster layers in World Mollweide projection (EPSG:54009) at 10m, 100m and 1000m spatial resolution, globally for the year 2018.

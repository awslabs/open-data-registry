Name: GHSL gridded land surface area estimates (GHS-LAND)
Description: GHS-LAND represents the fraction of land surface per grid cell, derived from a Sentinel-2 multispectral data composite from 2018 and OpenStreetMap (OSM) data.
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_land2022.php
Contact: JRC-GHSL-DATA@ec.europa.eu
ManagedBy: "[JRC](https://joint-research-centre.ec.europa.eu)"
UpdateFrequency: NA

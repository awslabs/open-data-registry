Name: T2T Genome Assemblies
Description: Telomere-to-telomere (T2T) genome assemblies, annotations, and associated raw sequencing data for human and non-human primates generated by the Logsdon Lab at the University of Pennsylvania.
Documentation: https://github.com/logsdon-lab/T2T-Genome-Assemblies
Contact: glogsdon@pennmedicine.upenn.edu
ManagedBy: Glennis Logsdon 
UpdateFrequency: Data is updated with every new genome assembly release. 
Tags:
  - T2T
  - genome
  - long read sequencing 
  - whole genome sequencing
License: NIH Genomic Data Sharing Policy: https://grants.nih.gov/policy-and-compliance/policy-topics/sharing-policies/gds

Resources: 
  - Description: T2T genome assemblies are provided as fasta files. PacBio HiFi and ONT sequencing data with methylation information are provided as bam and fastq files, and RNA and epigenomic data are provided as fastqs and bam files (when possible). Annotations for the genome assemblies will also be made available as BED, BigBed, or BigWig files.
    ARN: arn:aws:s3:::T2T-Genome-Assemblies
    Region: us-east-1
    Type: S3 Bucket

Name: Digital Earth Pacific Annual Radar Composite (Sentinel-1, GeoMAD, 10 m)
Description: |
  This dataset provides annual radar-based composite imagery derived from
  Sentinel-1 observations across the Pacific region. Sentinel-1 carries a
  C-band Synthetic Aperture Radar (SAR), which acquires data day and night
  and in all weather conditions, so the composite is independent of cloud
  cover.

  Multi-temporal Sentinel-1 backscatter observations (VV and VH
  polarisations) are aggregated into annual geometric median composites,
  along with median absolute deviation measures (emad, smad and bcmad) and
  a count of observations. The dataset is available annually from 2017 and
  supports monitoring of land, water, and environmental change.

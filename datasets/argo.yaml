Name: Annotated dataset of post-ischemic ventricular tachycardia electrograms (ARGO)
Description: The analysis and identification of abnormal ventricular potentials (AVPs)
  in intracardiac electrograms (EGMs) are paramount in radiofrequency catheter ablation
  (RFCA) of post-ischemic ventricular tachycardia (VT). The ARGO dataset represents
  the first open-access dataset of post-ischemic VT EGMs featuring invasive and noninvasive
  electrophysiological recordings, as well as electroanatomical (EA) map data, including
  data annotation by three expert electrophysiologists and their final consensus.
  The dataset includes unipolar and bipolar EGMs, 12-lead surface ECGs, and EA maps,
  for a total of 1962 entries collected from nine post-ischemic VT patients using
  the CARTO® 3 mapping system. Every entry encompasses annotations of the bipolar
  EGMs in three different classes, i.e., Physiological, AVP, or Unknown, as well as
  the delineation of the onset and end of the pathological activation in the AVPs.
  The dataset also incorporates detailed information about the spatial localization
  of ablations performed during the RFCA procedures.

Resources:
  - Description: >
      Artemis structured phenotyping images (1,387,665 images, four crops:
      common bean, cowpea, soybean, sorghum) with linked agronomic, genotypic,
      and environmental metadata. Field images (JPEG, original acquisition
      resolution) and annotations organised by crop under
      annotations/instance_segmentation/, annotations/object_detection/, and
      annotations/image_classification/ (COCO JSON and related formats).
      Parquet and CSV metadata files under each crop directory's metadata/
      subtree.
    ARN: arn:aws:s3:::alliance-artemis-imagesafari/Artemis
    Region: us-west-2
    Type: S3 Bucket
    Explore:
      - '[Browse Bucket](https://alliance-artemis-imagesafari.s3.amazonaws.com/index.html#Artemis/)'
  - Description: >
      Image Safari diversity-driven crop images (6,081,555 images, 18 crops)
      across nine countries in sub-Saharan Africa. Field images (JPEG, original
      acquisition resolution) and annotations organised by crop under
      annotations for point, semantic_segmentation, scribble, object_detection,
      and instance_segmentation (COCO JSON, PNG masks, and related formats).
      Per-image metadata is provided as JSON sidecar files.
    ARN: arn:aws:s3:::alliance-artemis-imagesafari/ImageSafari
    Region: us-west-2
    Type: S3 Bucket
    Explore:
      - '[Browse Bucket](https://alliance-artemis-imagesafari.s3.amazonaws.com/index.html#ImageSafari/)'


Resources:
  - Description: >
      Artemis structured phenotyping images (1,387,663 images, four crops:
      common bean, cowpea, soybean, sorghum) with linked agronomic, genotypic,
      and environmental metadata. Annotations are published for common bean,
      cowpea, and sorghum; soybean has imagery only. Field images (JPEG,
      original acquisition resolution) and annotations organised by crop under
      annotations/standard/instance_segmentation/<set>/ and
      annotations/standard/object_detection/<set>/ (COCO JSON and related
      formats). Parquet and CSV metadata files under each crop directory's
      metadata/ subtree.
    ARN: arn:aws:s3:::alliance-artemis-imagesafari/Artemis
    Region: us-west-2
    Type: S3 Bucket
    Explore:
      - '[Browse Bucket](https://alliance-artemis-imagesafari.s3.amazonaws.com/index.html#Artemis/)'
  - Description: >
      Image Safari diversity-driven crop images (6,081,555 images, 18 crops)
      across nine countries in sub-Saharan Africa. Annotations are published for
      16 of 18 crops; finger millet and lentil have imagery only. Field images
      (JPEG, original acquisition resolution) and annotations organised by crop
      under annotations for point, semantic_segmentation, scribble,
      object_detection, and instance_segmentation under
      annotations/standard/<modality>/<set>/ (COCO JSON, PNG masks, and related
      formats). Per-image metadata is provided as JSON sidecar files.
    ARN: arn:aws:s3:::alliance-artemis-imagesafari/ImageSafari
    Region: us-west-2
    Type: S3 Bucket
    Explore:
      - '[Browse Bucket](https://alliance-artemis-imagesafari.s3.amazonaws.com/index.html#ImageSafari/)'


Name: GHS‑WUP-DEGURBA
Description: This product contains the spatial raster dataset grids from 1975 to 2100 at 5 years interval representing the settlement classification per grid cell and, for the year 2025, the vector layers of the delineated boundaries of settlement entities (i.e. urban centres, UC, dense urban clusters, DUC, semi-dense urban clusters, SDUC, and rural clusters, RC) with main attributes, in vector files (country, area, population, built-up surface and population weighted centroid) and the list of country capitals with reference to the entity IDs.
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_wup_degurba_r2025a.php
Contact: JRC‑GHSL‑DATA@ec.europa.eu
ManagedBy: [JRC](https://joint-research-centre.ec.europa.eu)

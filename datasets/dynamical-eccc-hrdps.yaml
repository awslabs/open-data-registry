Name: ECCC HRDPS - dynamical.org Icechunk Zarr
Description: |
    The High Resolution Deterministic Prediction System (HRDPS) is the 2.5 km limited-area weather forecast model operated by Environment and Climate Change Canada (ECCC), Canada's national meteorological service. Its continental domain covers Canada and the northern United States at a resolution that captures fine-scale weather features.

    These datasets have been translated to cloud-optimized Icechunk Zarr format by [dynamical.org](https://dynamical.org).

    - [ECCC HRDPS forecast](https://dynamical.org/catalog/eccc-hrdps-forecast/) - Weather forecasts from the High Resolution Deterministic Prediction System (HRDPS) continental domain, operated by Environment and Climate Change Canada (ECCC).
Documentation: https://dynamical.org/catalog/
Contact: feedback@dynamical.org
ManagedBy: "[dynamical.org](https://dynamical.org)"
UpdateFrequency: "ECCC HRDPS forecast: Forecasts initialized every 6 hours"

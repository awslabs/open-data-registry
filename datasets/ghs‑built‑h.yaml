Name: GHS‑BUILT‑H
Description: Description: The spatial raster dataset depicts the spatial distribution of the building heights as extracted from the filtering of a composite of global digital elevation models (DEM) and the filtering of satellite imagery using linear regression techniques The used input DEMs are the ALOS World 3D - 30m (AW3D30, 2006-2011) and the Shuttle Radar Topography Mission 30m (SRTM30, 2000). The building heights extracted from these sources are updated using the support of the shadow markers extracted from the Sentinel2 image data composite of the year 2018 (GHS-composite-S2 R2020A). The Average of the Gross Building Height is the result of dividing the built-up volume by the grid surface. The Average of the Net Building Height is the result of dividing the built-up volume by the built-up surface.
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_buH2023.php

Name: 'SHDB-AF: a Japanese Holter ECG database of atrial fibrillation'
Description: Saitama Heart Database Atrial Fibrillation (SHDB-AF) is a novel open-sourced
  Holter ECG database from Japan, containing data from 122 unique subjects with paroxysmal
  atrial fibrillation. Among the 128 recordings, 98 contain raw ECG data with rhythm
  annotations at the beat level, manually performed by a cardiology fellow. The remaining
  recordings consist only of ECG traces without annotations. The dataset was collected
  as part of a study evaluating the generalization performance of a deep learning
  atrial fibrillation event detection model across different distribution shifts.

Name: Digital Earth Pacific Annual Surface Reflectance Composite (Landsat, GeoMAD, 30 m)
Description: |
  This dataset provides annual cloud-free composite imagery derived from
  Landsat surface reflectance observations across the Pacific region using
  geometric median and absolute deviation (GeoMAD) methods. The data are
  masked for cloud, shadows and other image artefacts using the associated
  pixel quality product to help provide as clear a set of observations as
  possible from which to calculate the medians.

  Along with the geometric median surface reflectance bands, the GeoMAD
  includes three measures of variability (Euclidean, spectral and Bray-
  Curtis median absolute deviations: emad, smad and bcmad) and a count of
  clear observations. The dataset is available annually from 2000 and
  supports monitoring of vegetation, land cover, and coastal environments.

Name: ALFRED on AWS
Title: "ALlele FREquency Database (ALFRED)"
Description: ALFRED is a database of allele frequencies for human populations.
    This open dataset provides denormalized chromosome-level tables
    containing population sample information together with SNP and
    allele frequency information.
Documentation: https://github.com/haseenaR/ALFRED/
Contact: haseena.rajeevan@yale.edu
ManagedBy: "Haseena Rajeevan"
UpdateFrequency: N/A.
Tags:
  - population genetics
  - genetic
  - genotyping
  - bioinformatics
License: ALFRED data must not be used in ways that promote stigma or discrimination against any individual or ethnic group..
DataAtWork:
  Tutorials:
  Title: Get to Know a Dataset: ALFRED (The Allele Frequency Database)
  URL: https://github.com/haseenaR/ALFRED/blob/main/alfred-dataset-tutorial.ipynb
  AuthorName: Haseena Rajeevan, Peter Schmiedeskamp
  
  
Publications:
    - Title: ALFRED: an allele frequency resource for research and teaching
      URL: https://pubmed.ncbi.nlm.nih.gov/22039151/

      AuthorName: Haseena Rajeevan, Usha Soundararajan, Judith R Kidd, Andrew J Pakstis & Kenneth K Kidd   

Dataset:
Name: alelle-frequency-tables
Version: 1.0
Description: Denormalized population genetic data containing SNP information, population/sample information, and allele frequencies for human populations. Data are provided as one Parquet table for each chromosome.
Format: "parquet"
Storage: "S3"
Bucket:
Name:alfred-mv
AWS Region:us-west-2
Files:
Data_organization:
  Strategy: "one-table-per-chromosome"
  Chromosome_tables:

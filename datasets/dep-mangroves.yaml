Name: Digital Earth Pacific Mangrove Extent, Density, Change and Condition (Sentinel-2, 10 m)
Description: |
  These datasets map mangrove ecosystems across Pacific Island Countries
  and Territories (PICTs) using Sentinel-2 satellite observations,
  supporting coastal protection, carbon accounting, biodiversity
  assessment, resilience planning, and ecosystem accounting. They comprise
  two products:

  - Mangrove Extent and Density: an extension of the Global Mangrove Watch
    (GMW v3, 2020) baseline, classifying mangrove areas annually from 2017
    into closed (high-density), open (lower density) and non-mangrove
    categories.
  - Mangrove Change and Condition (AMMI): analytical indicators describing
    changes and condition of mangrove ecosystems, built on the satellite-
    derived mangrove extent data to identify patterns of ecosystem change
    over time.
Documentation: https://digitalearthpacific.org/#/applications

Name: Pan-Primate Reference Genome Project (PanPrimate-T2T)
Description: >
Chromosome-scale, phased de novo genome assemblies and annotations for ~40 primate species spanning ~70 million years of evolutionary diversification, generated from established Coriell cell lines. Includes the full data lineage - raw PacBio HiFi and Oxford Nanopore ultra-long sequencing signal, phased haplotype-resolved and primary/alternate assemblies, gene and repeat annotations, methylation and Fiber-seq output, variant calls, and comparative whole-genome alignments (MAF/HAL) - released in cloud-optimized, indexed formats for direct region-based streaming and co-located compute on AWS.
Documentation: https://github.com/t2t-primates/PanPrimateGenomeProject/blob/main/README.md
Contact: https://github.com/t2t-primates/PanPrimateGenomeProject/issues
ManagedBy: "[University of California, Berkeley](https://ib.berkeley.edu)"
UpdateFrequency: >
New species assemblies are added on a rolling basis as sequencing and assembly complete. The initial ~40-species collection is expected to be substantially complete within about a year, after which updates are primarily re-curation/version revisions to existing genomes rather than large new data volumes.

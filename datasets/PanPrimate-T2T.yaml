Resources:
  - Description: >
      Per-sample sequencing data, assemblies, annotations, and alignments
      for the PanPrimate-T2T project. Includes raw ONT POD5s, PacBio HiFi/Kinnex BAM, primary/alternate genomes, GFF3 annotations, RepeatMasker output, methylation and Fiber-seq calls, VCF variant calls, and BAM read alignments - in bgzip/BAM/POD5 formats with .fai/.bai/.tbi indexes for HTTP byte-range access.
    ARN: "arn:aws:s3:::primate-t2t-genomics-open"
    Region: us-west-2
    Type: S3 Bucket

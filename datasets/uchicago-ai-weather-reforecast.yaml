License: |
  Forecasts were produced with third-party models, and the archive does not relicense them.
  The terms of the weights that generated each store apply: CC BY 4.0 (AIFS-single v2,
  AIFS-ENS v2, GraphCast, FGN), CC BY-SA 4.0 (NeuralGCM), and MIT (Aurora 1.5, Aurora 1.5 ENS).
  ECMWF data © European Centre for Medium-Range Weather Forecasts, licensed under
  [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/); contains modified Copernicus
  Climate Change Service information. See the
  [licensing & attribution details](https://envfluids.github.io/reforecast/) for full terms.
Resources:
  - Description: |
      Reforecasts stored as one zarr store per model per initialization at
      forecasts_<model>/init_YYYYMMDDT00.zarr. All data are float32 with dimensions
      (time, [number,] prediction_timedelta, lat, lon) for 6-hourly fields and
      prediction_timedelta_daily for daily aggregates; number is the ensemble-member dimension.

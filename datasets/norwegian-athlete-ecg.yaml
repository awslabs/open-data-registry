Name: Norwegian Endurance Athlete ECG Database
Description: The Norwegian Endurance Athlete ECG Database contains 12-lead ECG recordings
  from 28 elite athletes from various sports in Norway. All recordings are 10 seconds
  resting ECGs recorded with a General Electric (GE) MAC VUE 360 electrocardiograph.
  All ECGs are interpreted with both the GE Marquette SL12 algorithm (version 23 (v243))
  and one cardiologist with training in interpretation of athlete's ECG. The data
  was collected at the University of Oslo in February and March 2020.

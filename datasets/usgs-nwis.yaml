Name: USGS National Water Information System (NWIS) Water Data
Description: |
  The United States Geological Survey (USGS) collects water data at monitoring
  locations across the United States using automated sensors and manual data 
  collection. Each monitoring location has location information that details
  the location name and identifier, the agency responsible for data collection,
  and geographic information about the location. This dataset includes both
  continuous and daily data collected at these locations, collected as part of
  USGS' National Water Information System (NWIS).
  
  Continuous data are collected via automated sensors installed at a monitoring
  location. They are collected at a high frequency and often at a fixed 
  15-minute interval. Depending on the specific monitoring location, the data 
  may be transmitted automatically via telemetry and be available on WDFN
  within minutes of collection, while other times the delivery of data may be
  delayed if the monitoring location does not have the capacity to automatically
  transmit data. Continuous data are described by parameter name and parameter
  code (pcode). These data might also be referred to as "instantaneous values"
  or "IV".

  Daily data provide one data value to represent water conditions for the day. 
  Throughout much of the history of the USGS, the primary water data available
  were daily data. These data were originally collected manually at the 
  monitoring location each day, then transitioned to being recorded at the
  location. With improved availability of computer storage and automated
  transmission of data, the daily data published today are generally a summary
  statistic or single metric of the continuous data collected each day. Daily
  data are automatically calculated from the continuous data of the same
  parameter code and are described by parameter name and parameter code (pcode)
  and a statistic code. These data have also been referred to as “daily values”
  or “DV”.


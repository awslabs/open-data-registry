Name: ECMWF IFS Analysis N320 - Beyond Weather Icechunk Zarr
Description: |
  The ECMWF Integrated Forecasting System (IFS) operational analysis, every 6 hours from 2011
  to 2024, on the native N320 reduced Gaussian grid (542,080 points, about 31 km). It contains a
  selection of variables: 6 upper-air variables on 18 pressure levels, 18 surface variables, and
  the land-sea mask and orography of each IFS cycle. This is the input set of data-driven
  weather models such as ECMWF's AIFS, for training, fine-tuning and verification. Stored as
  versioned Icechunk Zarr, chunked by timestep for fast random access.
Documentation: https://github.com/Beyond-Weather-Git/open-data-examples/blob/main/ifs-analysis-n320/README.md

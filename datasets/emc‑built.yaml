Name: EMC-BUILT
Description: The EMC-BUILT product consists in three datasets, named EMC-BUILT-S (built-up surface), EMC-BUILT-S-NRES (non-residential built-up surface) and EMC-BUILT-GREENNESS (vegetation fraction in the built-up domain). The data is produced for the year 2022 and based on Sentinel-2 data.
Documentation: https://human-settlement.emergency.copernicus.eu/emc_built_s.php
Contact: JRC‑GHSL‑DATA@ec.europa.eu
ManagedBy: [JRC](https://joint-research-centre.ec.europa.eu)
UpdateFrequency: NA

Name: Harmonized Human Normal Brain Chromatin Accessibility Atlas (snATAC-seq)
Description: |
  A harmonized single-nucleus ATAC-seq (snATAC-seq) atlas of normal human brain
  tissue spanning 23 previously published cohorts (approximately 160 donors
  across multiple adult and developmental brain regions), totaling 41 million
  barcodes integrated against a shared 2,058,099-peak narrow union reference
  on GRCh38 (hg38). After the standard scATAC quality filter (nnz ≥ 1,000
  accessible peaks per cell), approximately 6 million high-quality cells remain,
  with every one of the 23 contributing studies still represented.

  The core problem this atlas solves: human normal brain snATAC-seq data has
  been publicly deposited across more than two dozen separate studies — SEA-AD,
  CATLAS, 4DN hippocampus, zen-Aerts Parkinson's substantia nigra, Siletti-like
  broad brain surveys, GEO deposits spanning cortex / striatum / cerebellum /
  hippocampus / brainstem / etc. — but those datasets have NEVER been
  harmonized against a shared peak set. Each cohort was processed independently
  with its own peak caller (CATLAS, author-defined, MACS2/MACS3 variants) and
  its own cell type taxonomy, which has forced every downstream user who wants
  a cross-cohort view to redo the harmonization work from scratch. This atlas
  does that work once: a Design-B union peak set deliberately constrained to
  narrow peaks (≤1,000 bp, median 518 bp, max 7 kb) to preserve AAV
  cloneability, projection of every cohort's cells to that shared peak set,
  and a 16-class major cell type taxonomy (Excitatory, Inhibitory, Astrocyte,
  Microglia, Oligodendrocyte, OPC, Endothelial, Progenitor, GABAergic
  subclasses, Dopaminergic, Serotonergic, T_cell, Immune_other, Meninges,
  Neuron_other, Unclassified).

  The atlas also includes a per-cohort "any-width overlap" replicability matrix
  recording for each narrow union peak which of the 23 contributing studies
  supports it at any peak width — 1,000,435 peaks (49%) are supported by all
  23 studies; 99.4% have ≥21-study support. This replicability signal is a
  core input to downstream enhancer-nomination scoring (specificity, strength,
  patient-level reproducibility, cross-cohort replication).

  Target users: computational neuroscientists, developers of normal-brain
  reference atlases, AAV therapy groups wanting a cross-cohort chromatin
  landscape for cell-type-specific element discovery, and anyone needing
  a harmonized human normal brain scATAC baseline.

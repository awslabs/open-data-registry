Name: Digital Earth Pacific Satellite-Derived Bathymetry (Sentinel-2, 10 m)
Description: |
  This dataset provides bathymetric estimates for optically shallow, clear
  coastal waters across the Pacific region using satellite imagery. It
  enables mapping of seabed depth in shallow coastal areas (typically down
  to depths where the seafloor remains optically visible, up to 30 m
  depth) where traditional survey data may be limited. The dataset
  supports marine spatial planning, coastal management, and environmental
  monitoring.

  It is derived from multispectral Sentinel-2 imagery using bathymetric
  inversion methods to estimate shallow water depth, and includes depth,
  mean, standard deviation and observation count layers.

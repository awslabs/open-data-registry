Name: StreetSpring Business Survivability Datasets
Description: |
  Projected chance, in percent, that a business type lasts two or more years at a specific place,
  for 110 business types in 3,514 neighborhoods and towns across 24 U.S. metropolitan areas. One
  national file (metro by business type) and 24 metro files (place by business type), 389,135 rows
  in total. Each row gives the chance at a typical address and at a good address (90th percentile of
  the place's scored locations), the best and weakest address with confidence bounds, ranks and
  tiers where ranked, and U.S. Census ACS context (income, poverty, education, commute, housing
  vacancy). The scores come from a model trained on 570,000+ observed business outcomes and more
  than 100 location factors. Every CSV opens with comment lines (prefixed #) that state the
  citation, the license, the version, the scale and worked recipes, and a README with the full
  column dictionary sits beside the files. Typical questions the data answers directly: where in a
  metro a given business type is most likely to last, which business types are most likely to last
  in a given neighborhood, and how two places compare for the same business.
Documentation: https://github.com/StreetSpringAI/open-data-examples/blob/main/streetspring-survivability/DOCUMENTATION.md
Contact: info@streetspring.com
ManagedBy: "[StreetSpring](https://streetspring.com)"
UpdateFrequency: Versioned releases whenever scores, places or documentation change (five dated versions from April to September 2026). Every version is recorded in CHANGELOG.md beside the files, and the concept DOI 10.5281/zenodo.22287996 always resolves to the newest one.

Name: EarthScope Geophysical Data

Description: |
  This dataset contains a subset of the geophysical data repositories
  of the National Science Foundation's (NSF) National Geophysical
  Facility (NGF) managed by the EarthScope Consortium.
  All data sets contain recordings, or derivatives thereof, from networks of
  geophysical sensors.

Documentation: https://docs.earthscope.org/sponsored-open-data
Contact: help@earthscope.org
ManagedBy: "[EarthScope Consortium](https://earthscope.org)"
UpdateFrequency: Daily
Tags:
  - aws-pds
  - earth observation
  - earthquakes
  - seismology
  - geophysics
  - geoscience
  - earth observation
  - machine learning
  - climate

License: |
  When using these data please cite both the network owners, identified by network code,
  and NSF's NGF facility operated by EarthScope.  Seismic network operators and owners specify the
  license for their data, and an appropriate citation, in their registration information which
  is available at: https://fdsn.org/networks/.  When no license has been declared by the owner,
  the facility distributes the data with a license of CC-BY-4.0. The facility operation can be
  cited using the instructions here: https://www.earthscope.org/how-to-cite/.


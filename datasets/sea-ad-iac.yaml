Name: "The SEA-AD Integrative Analysis Center Study (SEA-AD IAC)"

Description: |
  The Seattle Alzheimer's Disease Brain Cell Atlas Integrative Analysis Center
  (SEA-AD IAC) reprocesses datasets from SEA-AD and other large-scale
  Alzheimer's disease and related dementia studies to support harmonized
  cross-study analyses. The study provides uniformly processed single-cell
  genomics and multiomic data, harmonized metadata, and representations of
  disease pathology mapped to highly annotated BRAIN Initiative Cell Atlas
  Network (BICAN) and SEA-AD cell classifications. These resources support
  investigation of cell-type-specific molecular changes across Alzheimer's
  disease cohorts and stages of disease progression.

Documentation: "https://doi.org/10.7303/9618107"


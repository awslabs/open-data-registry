Resources:
  - Description: GHS-BUILT-S global gridded built-up surface estimates in World Mollweide projection (EPSG:54009) at 10m, 100m and 1000m spatial resolution; also available in WGS 1984 (EPSG:4326) at spatial resolutions of 3 and 30 arcseconds. Global spatial extent, temporal extent from 1975 to 2030 in 5-year steps for the 100 and 1000-m data, while the 10-m data are available for 2018.
    ARN: arn:aws:s3:::jrc-ghsl/ghs-built-s
    Region: eu-central-1
    Type: S3 Bucket
    Explore:
      - '[Browse Bucket](https://jrc-ghsl.s3.amazonaws.com/index.html)'
  - Description: GHS-BUILT-S_NRES global gridded built-up surface estimates for the "non-residential" (NRES) domain in World Mollweide projection (EPSG:54009) at 10m, 100m and 1000m spatial resolution; also available in WGS 1984 (EPSG:4326) at spatial resolutions of 3 and 30 arcseconds. Global spatial extent, temporal extent from 1975 to 2030 in 5-year steps for the 100 and 1000-m data, while the 10-m data are available for 2018.
    ARN: arn:aws:s3:::jrc-ghsl/ghs-built-s-nres
    Region: eu-central-1

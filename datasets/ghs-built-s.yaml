Name: GHSL global built-up surface estimates (GHS-BUILT-S)
Description: GHS-BUILT-S depicts the global distribution of built-up surface from 1975 to 2030, measured in square metres per grid cell. The dataset reports both the total built-up surface and the surface of predominantly non-residential (NRES) structures.
Documentation: https://human-settlement.emergency.copernicus.eu/ghs_buS2023.php
Contact: JRC-GHSL-DATA@ec.europa.eu
ManagedBy: "[JRC](https://joint-research-centre.ec.europa.eu)"
UpdateFrequency: NA

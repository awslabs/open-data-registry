Name: AWS Public Blockchain Data
Description: |
  The AWS Public Blockchain Data initiative provides free access to blockchain datasets through collaboration with data providers. The data is optimized for analytics by being transformed into compressed Parquet files, partitioned by date for efficient querying.

  #### Datasets

  | Blockchain dataset | Maintained by | Path |
  | --- | --- | --- |
  | Bitcoin | AWS | `s3://aws-public-blockchain/v1.0/btc/` |
  | Ethereum | AWS | `s3://aws-public-blockchain/v1.0/eth/` |
  | Aptos | SonarX | `s3://aws-public-blockchain/v1.1/sonarx/aptos/` |
  | Arbitrum | SonarX | `s3://aws-public-blockchain/v1.1/sonarx/arbitrum/` |
  | Base | SonarX | `s3://aws-public-blockchain/v1.1/sonarx/base/` |
  | BNB Chain | BNB Chain | `s3://aws-public-blockchain/v1.1/bnb/` |
  | Cronos | Cronos | `s3://aws-public-blockchain/v1.1/cronos/` |
  | Hyperliquid | Hyperliquid | `s3://aws-public-blockchain/v1.1/hyperliquid/` |
  | Lighter Core | Lighter | `s3://aws-public-blockchain/v1.1/lighter/core/` |
  | Lighter on Robinhood Chain | Lighter | `s3://aws-public-blockchain/v1.1/lighter/robinhood/` |
  | Provenance | SonarX | `s3://aws-public-blockchain/v1.1/sonarx/provenance/` |
  | Stellar ([XDR files](https://developers.stellar.org/docs/learn/fundamentals/data-format/xdr)) | Stellar | `s3://aws-public-blockchain/v1.1/stellar/` |
  | The Open Network (TON) | TON | `s3://aws-public-blockchain/v1.1/ton/` |
  | XRP Ledger | SonarX | `s3://aws-public-blockchain/v1.1/sonarx/xrp/` |

  #### Become a Data Provider

  We welcome additional blockchain data providers to join this initiative. If you're interested in contributing datasets to the AWS Public Blockchain Data program, please contact our team at [aws-public-blockchain@amazon.com](mailto:aws-public-blockchain@amazon.com).
Documentation: https://github.com/aws-samples/digital-assets-examples/blob/main/analytics/
Contact: aws-blockchain-data@amazon.com
ManagedBy: "[Amazon Web Services](https://aws.amazon.com/)"
UpdateFrequency: New data is delivered daily to the current date folders Parquet files.

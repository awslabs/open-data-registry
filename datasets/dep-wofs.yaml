Name: Digital Earth Pacific Water Observations from Space (WOfS, Landsat, 30 m)
Description: |
  Water Observations from Space (WOfS) maps the presence of surface water
  across the Pacific region using Landsat satellite imagery, highlighting
  where water is usually present and where it is rarely present. The
  dataset supports flood mapping, drought monitoring, hydrological
  analysis, and water resource management. It comprises three products:

  - Scene-based Surface Water: per-scene classification of surface water
    presence, derived from Landsat imagery using water detection
    algorithms, from 1984 onwards.
  - Annual Summary: annual statistics of wet and clear observation counts
    and water frequency, capturing interannual variability in water
    extent.
  - All-Time Summary: the frequency of water presence across all available
    observations, highlighting persistent and seasonal water bodies.
Documentation: https://digitalearthpacific.org/#/applications
Contact: dep@spc.int
ManagedBy: "[Pacific Community (SPC)](https://www.spc.int/)"
UpdateFrequency: Scene-based data is added as new Landsat scenes are acquired; summaries are updated annually

Name: Wearable Device Dataset from Induced Stress and Structured Exercise Sessions
Description: This original dataset contains physiological signals collected during
  structured acute stress induction and aerobic and anaerobic exercise sessions using
  a wearable device. Blood volume pulse, motion-based activity, skin temperature,
  and electrodermal activity were recorded with the Empatica E4, a research-grade
  wearable. The stress induction protocol involved math and emotional tasks designed
  to provoke stress responses, interleaved with rest periods. Self-reported stress
  levels were also recorded during this procedure. For the exercise sessions, distinct
  routines on a stationary bike were created for aerobic and anaerobic activities.
  The dataset includes records from 36 healthy volunteers for stress sessions, 30
  for aerobic exercise, and 31 for anaerobic exercise. By examining the variations
  in physiological signals, the effects of these activities can be analyzed. This
  dataset is a valuable resource for research on stress and exercise detection and
  classification.

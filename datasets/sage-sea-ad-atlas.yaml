Name: "Seattle Alzheimer's Disease Brain Cell Atlas (SEA-AD)"

Description: |
  The Seattle Alzheimer's Disease Brain Cell Atlas (SEA-AD) study provides
  transcriptomic and chromatin accessibility data from single nuclei isolated
  from postmortem brain tissue from individuals spanning the Alzheimer's disease
  spectrum. The study supports investigation of cellular and molecular changes
  associated with Alzheimer's disease progression and includes data generated as
  part of the broader SEA-AD effort to characterize brain cell types,
  disease-associated cellular states, and related neuropathology.


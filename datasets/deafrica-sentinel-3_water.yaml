Name: Digital Earth Africa Sentinel-3 OLCI L2 Water
Description: |
  The Sentinel-3 OLCI Level-2 Water Full Resolution (OL_2_WFR) product delivers satellite-derived observations for monitoring the optical properties, biological characteristics, and quality of marine and inland waters. Acquired by the Ocean and Land Colour Instrument (OLCI) onboard the Sentinel-3A and Sentinel-3B satellites, the product provides global coverage at approximately 300-meter spatial resolution, with a revisit time of 1–2 days at the equator when both satellites are operational. OLCI’s 21 spectral bands, spanning visible to near-infrared wavelengths, are designed to support detailed observations of water colour and ocean and inland water properties.Key outputs include water-leaving reflectance across multiple spectral bands, algal pigment (chlorophyll) concentration, Total Suspended Matter (TSM), and the diffuse attenuation coefficient (KD490), which provides an indication of water transparency. The product also includes atmospheric parameters such as aerosol optical depth, aerosol Ångström exponent, and Integrated Water Vapour (IWV), together with per-pixel quality and science flags and associated uncertainty estimates. These observations support applications such as water quality monitoring, detection and assessment of algal blooms, turbidity and sediment monitoring, aquatic ecosystem assessment, and the monitoring of changes in coastal and inland water bodies. Digital Earth Africa (DE Africa) provides open and free access to Sentinel-3 OLCI L2 Water Full Resolution products for the African continent via its cloud-hosted infrastructure and the DE Africa Sandbox. This enables direct analysis in cloud environments, and integration with other DE Africa datasets.

Documentation: https://docs.digitalearthafrica.org/en/latest/data_specs/Sentinel-3_OLCI_L2_WATER_specs.html

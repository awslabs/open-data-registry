Name: Missouri Statewide Aerial Imagery Collection
Description: | 
  The Missouri Spatial Data Information Service (MSDIS) is responsible for the storage and distribution of digital spatial data, aerial photography, and LiDAR related to the state of Missouri. 
Documentation: https://data-msdis.opendata.arcgis.com
Contact: msdismail@missouri.edu
ManagedBy: Missouri Spatial Data Information Service 
UpdateFrequency: Missouri's imagery cycle is based on funding availability.
